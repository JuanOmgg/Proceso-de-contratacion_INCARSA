<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · PSI</title>

  <!-- Favicon / Ícono de la pestaña del navegador -->
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', path='img/icono.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', path='img/icono.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='img/icono.png') }}">

  <!-- Tailwind CSS Compilado Local -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Fonts: Space Grotesk + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Estilos 100% exclusivos y autónomos del Login (CERO dependencia de styles.css o dark-mode.css) -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">

  <!-- Scripts necesarios -->
  <script src="{{ url_for('static', path='js/config.js') }}?v=3.5"></script>
  <script src="{{ url_for('static', path='js/auth.js') }}?v=3.5"></script>

  <!-- Limpieza de credenciales al cerrar sesión o expirar -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get("logout") || params.get("expired")) {
          sessionStorage.clear();
          localStorage.removeItem("incarsa_token");
          localStorage.removeItem("incarsa_session");
        }
      } catch (e) {}
    })();
  </script>

  <!-- Alpine.js Core Local -->
  <script defer src="{{ url_for('static', path='js/vendor/alpine.min.js') }}"></script>
</head>
<body class="antialiased">
<div class="login-page" x-data="loginForm()">
  <div class="login-page-stripes"></div>

  <!-- ============================================================
       SPLASH SCREEN / PANTALLA DE CARGA EN TODA LA PANTALLA
       ============================================================ -->
  <div class="splash-overlay"
       x-show="splash.activo"
       x-cloak
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-350"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-102">
    <div class="max-w-md w-full flex flex-col items-center">
      
      <!-- Spinner orbital de alta tecnología -->
      <div class="loader-pulse mb-6">
        <div class="loader"></div>
      </div>

      <!-- Marca e Identidad -->
      <h1 class="font-display font-bold text-white text-2xl tracking-wider splash-brand-glow">INCARSA</h1>
      <p class="text-[#9FADC9] text-xs font-medium mt-1 tracking-wide">Sistema de Gestión de Solicitudes de Acceso</p>

      <!-- Badge de Usuario Activo -->
      <div class="items-center gap-2 mt-4 px-3.5 py-1 rounded-full bg-white/[0.04] border border-white/10 text-xs text-orange-400 font-semibold shadow-[0_0_12px_rgba(249,115,22,0.2)]"
           :class="splash.usuarioNombre ? 'inline-flex' : 'hidden'">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span x-text="splash.usuarioNombre || 'Iniciando sesión'"></span>
      </div>

      <!-- Barra de progreso real -->
      <div class="splash-progress-track-custom">
        <div class="splash-progress-bar-custom"
             :style="'width: ' + splash.progreso + '%; ' + (splash.completado ? 'background: linear-gradient(90deg, #10b981 0%, #22c55e 100%); box-shadow: 0 0 16px rgba(34, 197, 94, 0.85), 0 0 4px #ffffff;' : '')"></div>
      </div>

      <!-- Porcentaje y Estado dinámico -->
      <div class="w-[280px] max-w-[85vw] flex items-center justify-between text-xs mt-3 px-0.5">
        <span class="text-slate-300 font-medium truncate flex items-center gap-1">
          <template x-if="!splash.completado">
            <span>
              <span x-text="splash.mensaje"></span><span class="splash-dot">.</span><span class="splash-dot">.</span><span class="splash-dot">.</span>
            </span>
          </template>
          <template x-if="splash.completado">
            <span class="text-emerald-400 font-semibold flex items-center gap-1.5">
              <i class="fa-solid fa-circle-check"></i>
              <span>¡Todo listo! Bienvenido</span>
            </span>
          </template>
        </span>
        <span class="text-slate-400 font-mono font-semibold ml-2" x-text="splash.progreso + '%'"></span>
      </div>

    </div>
  </div>

  <div class="error-brand-mark">
    <img src="{{ url_for('static', path='img/logo-sidebar.png') }}" alt="PSI" 
      class="h-10 w-auto object-contain select-none"
      style="mix-blend-mode: screen;">
  </div>

  <div class="login-glow-wrap anim-fade-up">
    <div class="login-glow-border">
      <div class="login-form-card p-6 sm:p-8">

        <!-- ============ Vista: Iniciar sesión ============ -->
        <template x-if="vista === 'login'">
          <div x-transition:enter="transition ease-[cubic-bezier(.25,.8,.25,1)] duration-350"
               x-transition:enter-start="opacity-0 -translate-x-4 scale-[0.98]"
               x-transition:enter-end="opacity-100 translate-x-0 scale-100"
               x-transition:leave="transition ease-in duration-200"
               x-transition:leave-start="opacity-100 translate-x-0 scale-100"
               x-transition:leave-end="opacity-0 translate-x-4 scale-[0.98]">
            <h2 class="font-display font-semibold text-2xl text-center text-[var(--ink-900)] mb-1">Iniciar sesión</h2>
            <p class="text-sm text-center text-[var(--text-muted)] mb-7">Ingresa con tu correo corporativo para continuar.</p>

            <form @submit.prevent="submit()" class="space-y-4">

              <div class="login-alert-error rounded-xl text-xs px-3.5 py-2.5 flex items-center gap-2.5"
                   x-show="error" x-cloak>
                <i class="fa-solid fa-triangle-exclamation text-sm text-red-400 flex-shrink-0"></i>
                <span x-text="error" class="font-medium leading-snug"></span>
              </div>

              <div>
                <label class="form-label">Correo corporativo</label>
                <input type="email" x-model="correo" autocomplete="username" placeholder="nombre.apellido@incarsa.com"
                       class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
              </div>

              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="form-label !mb-0">Contraseña</label>
                  <button type="button" @click="iniciarRecuperacion()" class="text-xs font-medium text-[var(--ink-700)] hover:text-[var(--signal-500)] transition-colors">¿Olvidaste tu contraseña?</button>
                </div>
                <div class="relative">
                  <input :type="showPassword ? 'text' : 'password'" x-model="contrasena" autocomplete="current-password" placeholder="••••••••"
                         class="input-field w-full rounded-lg px-3 py-2.5 pr-10 text-sm">
                  <button type="button" @click="togglePassword()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)] hover:text-[var(--ink-800)] transition-colors">
                    <i class="fa-regular" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                  </button>
                </div>
              </div>

              <label class="flex items-center gap-2 text-sm cursor-pointer pt-1">
                <input type="checkbox" x-model="recordarme">
                <span class="text-[var(--text-muted)]">Recordar sesión en este dispositivo</span>
              </label>

              <button type="submit" :disabled="submitting"
                      class="btn-signal btn-shimmer w-full rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2 mt-2"
                      :class="submitting ? 'is-submitting cursor-wait' : ''">
                <i class="fa-solid fa-spinner fa-spin" x-show="submitting"></i>
                <span x-text="submitting ? 'Verificando…' : 'Iniciar sesión'"></span>
              </button>
            </form>

            <p class="text-xs text-[var(--text-muted)] text-center mt-6">
              ¿Problemas para ingresar? </br>
              <button type="button" @click="vista = 'contacto'" class="font-medium text-[var(--ink-800)] hover:text-[var(--signal-500)] underline underline-offset-2 transition-colors">
                Contacta a tu administrador
              </button>
            </p>
          </div>
        </template>

        <!-- ============ Vista: Contactar administrador ============ -->
        <template x-if="vista === 'contacto'">
          <div x-transition:enter="transition ease-[cubic-bezier(.25,.8,.25,1)] duration-350"
               x-transition:enter-start="opacity-0 translate-x-4 scale-[0.98]"
               x-transition:enter-end="opacity-100 translate-x-0 scale-100"
               x-transition:leave="transition ease-in duration-200"
               x-transition:leave-start="opacity-100 translate-x-0 scale-100"
               x-transition:leave-end="opacity-0 -translate-x-4 scale-[0.98]">

            <!-- Estado: formulario -->
            <template x-if="!contacto.enviado">
              <div>
                <button type="button" @click="vista = 'login'" class="text-xs font-medium text-[var(--text-muted)] hover:text-[var(--signal-500)] transition-colors inline-flex items-center gap-1.5 mb-4">
                  <i class="fa-solid fa-arrow-left text-[10px]"></i> Volver a iniciar sesión
                </button>

                <h2 class="font-display font-semibold text-2xl text-[var(--ink-900)] mb-1">Contactar administrador</h2>
                <p class="text-sm text-[var(--text-muted)] mb-6">Cuéntanos qué pasó y te ayudaremos a recuperar el acceso.</p>

                <div class="space-y-4">
                  <div>
                    <label class="form-label">Asunto</label>
                    <select x-model="contacto.asunto" class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
                      <option>Problemas para iniciar sesión</option>
                      <option>Solicitar acceso a una planta</option>
                      <option>Reportar un error del sistema</option>
                      <option>Otro</option>
                    </select>
                  </div>

                  <div>
                    <label class="form-label">Preséntate</label>
                    <input type="text" x-model="contacto.presentacion" placeholder="Tu nombre, cargo y empresa"
                           class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
                  </div>

                  <div>
                    <label class="form-label">Mensaje</label>
                    <textarea x-model="contacto.mensaje" rows="4" placeholder="Describe tu problema o solicitud…"
                              class="input-field w-full rounded-lg px-3 py-2.5 text-sm resize-none"></textarea>
                  </div>

                  <button type="button" @click="enviarContacto()" :disabled="contacto.enviando || !contacto.presentacion.trim() || !contacto.mensaje.trim()"
                          class="btn-signal btn-shimmer w-full rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2 mt-2"
                          :class="(contacto.enviando || !contacto.presentacion.trim() || !contacto.mensaje.trim()) ? (contacto.enviando ? 'is-submitting cursor-wait' : 'opacity-70 cursor-not-allowed') : ''">
                    <i class="fa-solid fa-spinner fa-spin" x-show="contacto.enviando"></i>
                    <span x-text="contacto.enviando ? 'Enviando…' : 'Enviar mensaje'"></span>
                  </button>
                </div>
              </div>
            </template>

            <!-- Estado: enviado -->
            <template x-if="contacto.enviado">
              <div class="text-center py-6">
                <div class="success-icon-pop w-14 h-14 rounded-full bg-[var(--state-aprobado-bg)] text-[var(--state-aprobado)] flex items-center justify-center mx-auto mb-4">
                  <i class="fa-solid fa-check text-2xl"></i>
                </div>
                <h2 class="font-display font-semibold text-lg text-[var(--ink-900)] mb-1">Mensaje enviado</h2>
                <p class="text-sm text-[var(--text-muted)]">Un administrador te contactará pronto.</p>
              </div>
            </template>

          </div>
        </template>

        <!-- ============ Vista: Restablecer contraseña en pasos ============ -->
        <template x-if="vista === 'olvide'">
          <div x-transition:enter="transition ease-[cubic-bezier(.25,.8,.25,1)] duration-350"
               x-transition:enter-start="opacity-0 translate-x-4 scale-[0.98]"
               x-transition:enter-end="opacity-100 translate-x-0 scale-100"
               x-transition:leave="transition ease-in duration-200"
               x-transition:leave-start="opacity-100 translate-x-0 scale-100"
               x-transition:leave-end="opacity-0 -translate-x-4 scale-[0.98]">

            <!-- Barra indicadora de pasos (oculta en pantalla de éxito) -->
            <div class="recovery-steps-bar" x-show="olvide.paso < 4">
              <div class="recovery-step-dot" :class="{ 'is-active': olvide.paso === 1, 'is-completed': olvide.paso > 1 }" title="Paso 1: Correo"></div>
              <div class="recovery-step-dot" :class="{ 'is-active': olvide.paso === 2, 'is-completed': olvide.paso > 2 }" title="Paso 2: Código"></div>
              <div class="recovery-step-dot" :class="{ 'is-active': olvide.paso === 3, 'is-completed': olvide.paso > 3 }" title="Paso 3: Nueva contraseña"></div>
            </div>

            <!-- ==============================================
                 PASO 1: Ingreso de correo corporativo válido
                 ============================================== -->
            <template x-if="olvide.paso === 1">
              <div>
                <button type="button" @click="vista = 'login'" class="text-xs font-medium text-[var(--text-muted)] hover:text-[var(--signal-500)] transition-colors inline-flex items-center gap-1.5 mb-4">
                  <i class="fa-solid fa-arrow-left text-[10px]"></i> Volver a iniciar sesión
                </button>

                <h2 class="font-display font-semibold text-2xl text-center text-[var(--ink-900)] mb-1">Recuperar contraseña</h2>
                <p class="text-sm text-[var(--text-muted)] mb-6 text-center">Ingresa tu correo corporativo y te enviaremos un código de verificación.</p>

                <form @submit.prevent="enviarCodigoRecuperacion()" class="space-y-4">
                  <div class="login-alert-error rounded-xl text-xs px-3.5 py-2.5 flex items-center gap-2.5"
                       x-show="olvide.error" x-cloak>
                    <i class="fa-solid fa-triangle-exclamation text-sm text-red-400 flex-shrink-0"></i>
                    <span x-text="olvide.error" class="font-medium leading-snug"></span>
                  </div>

                  <div>
                    <label class="form-label">Correo corporativo</label>
                    <input type="email" x-model="olvide.correo" autocomplete="username" placeholder="nombre.apellido@incarsa.com"
                           class="input-field w-full rounded-lg px-3 py-2.5 text-sm" required>
                  </div>

                  <button type="submit" :disabled="olvide.enviando || !olvide.correo.trim()"
                          class="btn-signal btn-shimmer w-full rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2 mt-2"
                          :class="(olvide.enviando || !olvide.correo.trim()) ? (olvide.enviando ? 'is-submitting cursor-wait' : 'opacity-70 cursor-not-allowed') : ''">
                    <i class="fa-solid fa-spinner fa-spin" x-show="olvide.enviando"></i>
                    <span x-text="olvide.enviando ? 'Enviando código…' : 'Enviar código de verificación'"></span>
                  </button>
                </form>
              </div>
            </template>

            <!-- ==============================================
                 PASO 2: Ingresar código de verificación
                 ============================================== -->
            <template x-if="olvide.paso === 2">
              <div>
                <button type="button" @click="olvide.paso = 1; olvide.error = '';" class="text-xs font-medium text-[var(--text-muted)] hover:text-[var(--signal-500)] transition-colors inline-flex items-center gap-1.5 mb-4">
                  <i class="fa-solid fa-arrow-left text-[10px]"></i> Cambiar correo
                </button>

                <h2 class="font-display font-semibold text-2xl text-center text-[var(--ink-900)] mb-1">Ingresa el código</h2>
                <p class="text-sm text-[var(--text-muted)] mb-4 text-center">
                  Hemos enviado un código de 6 dígitos a <strong class="text-white block truncate" x-text="olvide.correo"></strong>
                </p>

                <!-- Hint de simulación para pruebas (solo si no se envió por email) -->
                <div class="simulation-code-badge mb-4" x-show="olvide.codigoGenerado">
                  <i class="fa-solid fa-flask text-base text-cyan-400 flex-shrink-0"></i>
                  <div class="text-left leading-tight">
                    <span class="block text-[11px] opacity-80">Código de prueba:</span>
                    <span class="font-mono font-bold tracking-widest text-sm text-white" x-text="olvide.codigoGenerado"></span>
                  </div>
                </div>

                <!-- Aviso de correo enviado a bandeja -->
                <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-3.5 py-2.5 mb-4 text-xs text-emerald-300 flex items-center gap-2.5" x-show="!olvide.codigoGenerado">
                  <i class="fa-solid fa-envelope-circle-check text-sm text-emerald-400 flex-shrink-0"></i>
                  <span>Código enviado a tu correo. Revisa tu bandeja de entrada o spam.</span>
                </div>

                <form @submit.prevent="verificarCodigoRecuperacion()" class="space-y-4">
                  <div class="login-alert-error rounded-xl text-xs px-3.5 py-2.5 flex items-center gap-2.5"
                       x-show="olvide.error" x-cloak>
                    <i class="fa-solid fa-triangle-exclamation text-sm text-red-400 flex-shrink-0"></i>
                    <span x-text="olvide.error" class="font-medium leading-snug"></span>
                  </div>

                  <div>
                    <label class="form-label text-center block mb-2">Código de 6 dígitos</label>
                    <input type="text"
                           x-model="olvide.codigo"
                           @input="olvide.codigo = olvide.codigo.replace(/[^0-9]/g, '').slice(0, 6); if(olvide.codigo.length === 6) verificarCodigoRecuperacion()"
                           maxlength="6"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           placeholder="······"
                           class="recovery-code-input w-full" autofocus>
                  </div>

                  <!-- Reenviar código con cuenta regresiva -->
                  <div class="text-center pt-1 pb-1">
                    <template x-if="!olvide.puedeReenviar">
                      <span class="text-xs text-[var(--text-muted)] flex items-center justify-center gap-1.5">
                        <i class="fa-regular fa-clock text-[10px]"></i>
                        <span>Reenviar código en <strong class="font-mono text-white" x-text="olvide.temporizador"></strong>s</span>
                      </span>
                    </template>
                    <template x-if="olvide.puedeReenviar">
                      <button type="button" @click="reenviarCodigoRecuperacion()"
                              class="text-xs font-semibold text-[var(--signal-500)] hover:underline inline-flex items-center gap-1">
                        <i class="fa-solid fa-rotate-right text-[10px]"></i>
                        <span>¿No recibiste el código? Reenviar</span>
                      </button>
                    </template>
                  </div>

                  <button type="submit" :disabled="olvide.codigo.trim().length !== 6"
                          class="btn-signal btn-shimmer w-full rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2"
                          :class="olvide.codigo.trim().length !== 6 ? 'opacity-60 cursor-not-allowed' : ''">
                    <span>Verificar código</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                  </button>
                </form>
              </div>
            </template>

            <!-- ==============================================
                 PASO 3: Nueva contraseña y confirmación
                 ============================================== -->
            <template x-if="olvide.paso === 3">
              <div>
                <h2 class="font-display font-semibold text-2xl text-center text-[var(--ink-900)] mb-1">Nueva contraseña</h2>
                <p class="text-sm text-[var(--text-muted)] mb-5 text-center">Crea una nueva contraseña segura para acceder a tu cuenta.</p>

                <form @submit.prevent="actualizarContrasena()" class="space-y-4">
                  <div class="login-alert-error rounded-xl text-xs px-3.5 py-2.5 flex items-center gap-2.5"
                       x-show="olvide.error" x-cloak>
                    <i class="fa-solid fa-triangle-exclamation text-sm text-red-400 flex-shrink-0"></i>
                    <span x-text="olvide.error" class="font-medium leading-snug"></span>
                  </div>

                  <div>
                    <label class="form-label">Nueva contraseña</label>
                    <div class="relative">
                      <input :type="olvide.showPass1 ? 'text' : 'password'"
                             x-model="olvide.nuevaContrasena"
                             placeholder="Mínimo 8 caracteres"
                             class="input-field w-full rounded-lg px-3 py-2.5 pr-10 text-sm">
                      <button type="button" @click="olvide.showPass1 = !olvide.showPass1" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)] hover:text-white transition-colors">
                        <i class="fa-regular" :class="olvide.showPass1 ? 'fa-eye-slash' : 'fa-eye'"></i>
                      </button>
                    </div>
                    <div class="mt-1.5 flex items-center gap-1.5 text-[11px] transition-colors"
                         :class="olvide.nuevaContrasena.length >= 8 ? 'text-emerald-400 font-medium' : 'text-[var(--text-muted)]'">
                      <i class="fa-solid" :class="olvide.nuevaContrasena.length >= 8 ? 'fa-circle-check text-xs' : 'fa-circle text-[6px]'"></i>
                      <span>Mínimo 8 caracteres</span>
                    </div>
                  </div>

                  <div>
                    <label class="form-label">Confirmar nueva contraseña</label>
                    <div class="relative">
                      <input :type="olvide.showPass2 ? 'text' : 'password'"
                             x-model="olvide.confirmarContrasena"
                             placeholder="Repite la contraseña"
                             class="input-field w-full rounded-lg px-3 py-2.5 pr-10 text-sm">
                      <button type="button" @click="olvide.showPass2 = !olvide.showPass2" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)] hover:text-white transition-colors">
                        <i class="fa-regular" :class="olvide.showPass2 ? 'fa-eye-slash' : 'fa-eye'"></i>
                      </button>
                    </div>

                    <template x-if="olvide.confirmarContrasena.length > 0">
                      <div class="mt-1.5 flex items-center gap-1.5 text-[11px] font-medium transition-colors"
                           :class="olvide.nuevaContrasena === olvide.confirmarContrasena ? 'text-emerald-400' : 'text-red-400'">
                        <i class="fa-solid" :class="olvide.nuevaContrasena === olvide.confirmarContrasena ? 'fa-circle-check text-xs' : 'fa-circle-xmark text-xs'"></i>
                        <span x-text="olvide.nuevaContrasena === olvide.confirmarContrasena ? 'Las contraseñas coinciden' : 'Las contraseñas no coinciden'"></span>
                      </div>
                    </template>
                  </div>

                  <button type="submit" :disabled="olvide.enviando || olvide.nuevaContrasena.length < 8 || olvide.nuevaContrasena !== olvide.confirmarContrasena"
                          class="btn-signal btn-shimmer w-full rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2 mt-2"
                          :class="(olvide.enviando || olvide.nuevaContrasena.length < 8 || olvide.nuevaContrasena !== olvide.confirmarContrasena) ? (olvide.enviando ? 'is-submitting cursor-wait' : 'opacity-60 cursor-not-allowed') : ''">
                    <i class="fa-solid fa-spinner fa-spin" x-show="olvide.enviando"></i>
                    <span x-text="olvide.enviando ? 'Actualizando contraseña…' : 'Restablecer contraseña'"></span>
                  </button>
                </form>
              </div>
            </template>

            <!-- ==============================================
                 PASO 4: Confirmación de éxito
                 ============================================== -->
            <template x-if="olvide.paso === 4">
              <div class="text-center py-4">
                <div class="success-icon-pop w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/10">
                  <i class="fa-solid fa-circle-check text-3xl"></i>
                </div>
                <h2 class="font-display font-semibold text-xl text-[var(--ink-900)] mb-1.5">¡Contraseña restablecida!</h2>
                <p class="text-sm text-[var(--text-muted)] mb-6">
                  Tu contraseña ha sido actualizada con éxito. Serás redirigido al inicio de sesión en unos momentos...
                </p>

                <button type="button" @click="finalizarRecuperacion()"
                        class="btn-signal btn-shimmer w-full rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2">
                  <span>Iniciar sesión ahora</span>
                  <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
              </div>
            </template>

          </div>
        </template>

      </div>
    </div>
  </div>
</div>
</body>
</html>
