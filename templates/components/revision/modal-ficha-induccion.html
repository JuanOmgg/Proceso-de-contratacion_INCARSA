    <!-- ============================================================
       MODAL 1: DETALLE Y VIGENCIA DE INDUCCIÓN - GESCO (Estilo Ticket)
    ============================================================= -->
    <div x-show="showInduccionModal && puedeVerInduccion" x-cloak
      class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop"
      @keydown.escape.window="cerrarInduccionModal()"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0">
      
      <div x-show="showInduccionModal"
        @click.outside="cerrarInduccionModal()"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-4"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-4"
        class="modal-panel modal-ticket w-full max-w-3xl pt-7 px-6 sm:px-8 pb-9 relative text-center" x-cloak>
        
        <!-- Botón cerrar superior derecho -->
        <button type="button" @click="cerrarInduccionModal()"
          class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center text-[var(--paper-muted)] hover:text-[var(--paper-ink)] hover:bg-black/5 dark:hover:bg-white/10 transition-all z-20"
          title="Cerrar modal">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>

        <!-- Encabezado estilo Ticket -->
        <div class="text-center mb-4">
          <h2 class="font-display font-bold text-2xl text-[var(--paper-ink)] tracking-tight mb-1"
            x-text="'Vigencia de Inducción: ' + (detalleInduccion.persona_nombre || '') + ' ' + (detalleInduccion.persona_apellido || '')"></h2>
          <div class="flex items-center justify-center gap-2 mt-1.5 flex-wrap">
            <span class="status-pill inline-flex select-none font-semibold text-purple-700 bg-purple-50 border border-purple-200 dark:bg-purple-950/40 dark:text-purple-300 dark:border-purple-800/60 text-xs">
              <i class="fa-solid fa-graduation-cap mr-1.5 text-purple-600 dark:text-purple-400"></i> Auditoría GESCO (1 Año)
            </span>
            <span class="text-xs font-mono font-bold text-[var(--paper-muted)] bg-[#efe9dc] dark:bg-white/10 px-2.5 py-0.5 rounded-md border border-[var(--paper-shadow)]"
              x-text="(detalleInduccion.persona_tipo_doc || 'CC') + ': ' + detalleInduccion.persona_identificacion"></span>
            <span class="text-xs text-[var(--paper-muted)] font-medium" x-show="detalleInduccion.persona_cargo">
              · <span x-text="detalleInduccion.persona_cargo"></span>
            </span>
          </div>
        </div>

        <!-- Cuerpo scrollable estilo Ticket -->
        <div class="max-h-[62vh] overflow-y-auto custom-scroll pr-1.5 text-left border-y border-dashed border-[var(--paper-shadow)] py-3.5 my-3.5 space-y-4">
          
          <!-- Resumen Informativo: Responsable, Empresa y Vigencia Actual (Estilo Neón) -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
            
            <!-- 1. Responsable GESCO (Púrpura / Indigo Neón) -->
            <div class="historial-summary-card card-responsable p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/40 dark:bg-white/[0.03] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-11 h-11 rounded-2xl bg-indigo-500/15 text-indigo-500 dark:text-indigo-400 flex items-center justify-center flex-shrink-0 text-lg font-bold border border-indigo-500/30">
                <i class="fa-solid fa-user-check"></i>
              </div>
              <div class="min-w-0 flex-1">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Auditor GESCO</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white truncate mt-0.5" x-text="detalleInduccion.responsable || 'Sin auditor asignado'"></p>
              </div>
            </div>

            <!-- 2. Empresa Contratista (Cian Eléctrico Neón) -->
            <div class="historial-summary-card card-empresa p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/40 dark:bg-white/[0.03] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-11 h-11 rounded-2xl bg-cyan-500/15 text-cyan-500 dark:text-cyan-400 flex items-center justify-center flex-shrink-0 text-lg font-bold border border-cyan-500/30">
                <i class="fa-solid fa-briefcase"></i>
              </div>
              <div class="min-w-0 flex-1">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Empresa</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white truncate mt-0.5" x-text="detalleInduccion.ultima_empresa_contratista || 'Sin empresa asignada'"></p>
                <span class="text-[11px] text-[var(--paper-muted)] dark:text-slate-400 font-medium block leading-tight mt-0.5">Contratista vinculada</span>
              </div>
            </div>

            <!-- 3. Vigencia Actual de la Inducción (Esmeralda Neón) -->
            <div class="historial-summary-card card-vigencia p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/40 dark:bg-white/[0.03] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-11 h-11 rounded-2xl flex items-center justify-center flex-shrink-0 text-lg font-bold border"
                :class="getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).estado === 'sin_induccion' ? 'bg-slate-500/15 text-slate-500 dark:text-slate-400 border-slate-500/30' : (getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).estado === 'vencido' ? 'bg-red-500/15 text-red-500 border-red-500/30' : (getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).estado === 'por_vencer' ? 'bg-amber-500/15 text-amber-500 border-amber-500/30' : 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30'))">
                <i :class="getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).icono"></i>
              </div>
              <div class="min-w-0 flex-1">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Vigencia Inducción</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white truncate mt-0.5" x-text="detalleInduccion.fecha_vigencia ? formatearFechaLegible(detalleInduccion.fecha_vigencia) : 'Sin fecha'"></p>
                <span class="text-[11px] block leading-tight mt-0.5"
                  :class="getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).estado === 'sin_induccion' ? 'text-slate-400 font-medium' : (getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).estado === 'vencido' ? 'text-red-400 font-semibold drop-shadow-[0_0_8px_rgba(239,68,68,0.4)]' : (getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).estado === 'por_vencer' ? 'text-amber-400 font-semibold drop-shadow-[0_0_8px_rgba(245,158,11,0.4)]' : 'text-emerald-400 font-semibold drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]'))"
                  x-text="getEstadoVigenciaInduccion(detalleInduccion.fecha_vigencia).etiqueta"></span>
              </div>
            </div>

          </div>

          <!-- Fechas clave de la Inducción (Tarjetas con Estilo Neón) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div class="historial-summary-card card-responsable p-3.5 sm:p-4 rounded-2xl bg-[#efe9dc]/35 dark:bg-white/[0.025] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-10 h-10 rounded-xl bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 flex items-center justify-center flex-shrink-0 text-base font-bold border border-indigo-500/25">
                <i class="fa-solid fa-calendar-check"></i>
              </div>
              <div class="min-w-0">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Fecha Realización Curso</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white block mt-0.5" x-text="detalleInduccion.fecha_induccion ? formatearFechaLegible(detalleInduccion.fecha_induccion) : 'No registrada'"></p>
              </div>
            </div>

            <div class="historial-summary-card card-vigencia p-3.5 sm:p-4 rounded-2xl bg-[#efe9dc]/35 dark:bg-white/[0.025] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 flex items-center justify-center flex-shrink-0 text-base font-bold border border-emerald-500/25">
                <i class="fa-solid fa-hourglass-half"></i>
              </div>
              <div class="min-w-0">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Límite de Vigencia (+1 Año)</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white block mt-0.5" x-text="detalleInduccion.fecha_vigencia ? formatearFechaLegible(detalleInduccion.fecha_vigencia) : 'Sin vigencia registrada'"></p>
              </div>
            </div>
          </div>

          <!-- Observaciones / Anotaciones Registradas -->
          <div class="p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/35 dark:bg-white/[0.025] border border-[var(--paper-shadow)] dark:border-white/[0.05] space-y-2">
            <div class="subtitles-modal text-xs font-bold uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-graduation-cap text-purple-600 dark:text-purple-400 text-sm"></i>
              <span>Anotaciones y Observaciones del Curso</span>
            </div>
            <p class="text-xs text-[var(--paper-ink)] dark:text-slate-200 leading-relaxed whitespace-pre-line bg-[#efe9dc]/50 dark:bg-white/[0.02] p-3.5 rounded-xl border border-[var(--paper-shadow)] dark:border-white/[0.05] font-medium"
              x-text="detalleInduccion.anotaciones || 'No se han registrado observaciones adicionales sobre la inducción de este ingresante.'"></p>
          </div>

        </div>

        <!-- Pie del modal -->
        <div class="flex items-center justify-center gap-3 pt-2">
          <button type="button" @click="cerrarInduccionModal()"
            class="modal-btn-cancel px-6 py-2.5 text-sm font-semibold">
            Cerrar
          </button>
          
          <button type="button" @click="abrirFormularioInduccion(detalleInduccion)"
            class="px-6 py-2.5 text-sm font-semibold rounded-lg bg-purple-600 hover:bg-purple-700 text-white shadow-sm flex items-center gap-2 transition-all">
            <i class="fa-solid fa-id-card-clip text-xs"></i>
            <span>Actualizar</span>
          </button>
        </div>

        <div class="modal-serrated"></div>
      </div>
    </div>
