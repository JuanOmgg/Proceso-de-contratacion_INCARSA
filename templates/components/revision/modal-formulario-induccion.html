    <!-- ============================================================
       MODAL 2: ACTUALIZACIÓN / RENOVACIÓN DE INDUCCIÓN - GESCO (Estilo Ticket)
    ============================================================= -->
    <div x-show="showFormInduccionModal && puedeVerInduccion" x-cloak
      class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop"
      @keydown.escape.window="cerrarFormularioInduccion()"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0">

      <div x-show="showFormInduccionModal"
        @click.outside="cerrarFormularioInduccion()"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-4"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-4"
        class="modal-panel modal-ticket w-full max-w-3xl pt-7 px-6 sm:px-8 pb-9 relative text-center" x-cloak>
        
        <!-- Botón cerrar -->
        <button type="button" @click="cerrarFormularioInduccion()"
          class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center text-[var(--paper-muted)] hover:text-[var(--paper-ink)] hover:bg-black/5 dark:hover:bg-white/10 transition-all z-20"
          title="Cerrar modal">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>

        <!-- Encabezado -->
        <div class="text-center mb-4">
          <h2 class="font-display font-bold text-2xl text-[var(--paper-ink)] tracking-tight mb-1"
            x-text="'Renovar Inducción: ' + (formInduccion.persona_nombre || '') + ' ' + (formInduccion.persona_apellido || '')"></h2>
          <div class="flex items-center justify-center gap-2 mt-1.5 flex-wrap">
            <span class="status-pill inline-flex select-none font-semibold text-purple-700 bg-purple-50 border border-purple-200 dark:bg-purple-950/40 dark:text-purple-300 dark:border-purple-800/60 text-xs">
              <i class="fa-solid fa-calendar-plus mr-1.5 text-purple-600 dark:text-purple-400"></i> Renovación de Vigencia (1 Año)
            </span>
            <span class="text-xs font-mono font-bold text-[var(--paper-muted)] bg-[#efe9dc] dark:bg-white/10 px-2.5 py-0.5 rounded-md border border-[var(--paper-shadow)]"
              x-text="(formInduccion.persona_tipo_doc || 'CC') + ': ' + formInduccion.persona_identificacion"></span>
            <span class="text-xs text-[var(--paper-muted)] font-medium" x-show="formInduccion.persona_cargo">
              · <span x-text="formInduccion.persona_cargo"></span>
            </span>
          </div>
        </div>

        <!-- Cuerpo scrollable -->
        <div class="max-h-[62vh] overflow-y-auto custom-scroll pr-1.5 text-left border-y border-dashed border-[var(--paper-shadow)] py-3.5 my-3.5 space-y-4">
          
          <!-- Alertas -->
          <div x-show="mensajeExitoInduccion" x-transition class="p-3.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 text-sm flex items-center gap-3 font-medium">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span x-text="mensajeExitoInduccion"></span>
          </div>
          <div x-show="mensajeErrorInduccion" x-transition class="p-3.5 rounded-xl bg-red-500/15 border border-red-500/30 text-red-600 dark:text-red-400 text-sm flex items-center gap-3 font-medium">
            <i class="fa-solid fa-circle-exclamation text-base"></i>
            <span x-text="mensajeErrorInduccion"></span>
          </div>

          <!-- Tarjetas de Información: Mismo orden y estilo que Detalle (Neón) -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
            
            <!-- 1. Auditor GESCO (Púrpura / Indigo Neón) -->
            <div class="historial-summary-card card-responsable p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/40 dark:bg-white/[0.03] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-11 h-11 rounded-2xl bg-indigo-500/15 text-indigo-500 dark:text-indigo-400 flex items-center justify-center flex-shrink-0 text-lg font-bold border border-indigo-500/30">
                <i class="fa-solid fa-user-check"></i>
              </div>
              <div class="min-w-0 flex-1">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Auditor GESCO</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white truncate mt-0.5" x-text="formInduccion.responsable || 'Auditor GESCO'"></p>
                <span class="text-[11px] text-[var(--paper-muted)] dark:text-slate-400 font-medium block leading-tight mt-0.5">Gestión del Conocimiento</span>
              </div>
            </div>

            <!-- 2. Empresa Contratista (Cian Eléctrico Neón) -->
            <div class="historial-summary-card card-empresa p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/40 dark:bg-white/[0.03] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-11 h-11 rounded-2xl bg-cyan-500/15 text-cyan-500 dark:text-cyan-400 flex items-center justify-center flex-shrink-0 text-lg font-bold border border-cyan-500/30">
                <i class="fa-solid fa-briefcase"></i>
              </div>
              <div class="min-w-0 flex-1">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Empresa</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white truncate mt-0.5" x-text="formInduccion.ultima_empresa_contratista || 'Sin empresa registrada'"></p>
                <span class="text-[11px] text-[var(--paper-muted)] dark:text-slate-400 font-medium block leading-tight mt-0.5">Contratista vinculada</span>
              </div>
            </div>

            <!-- 3. Vigencia Inducción (+1 Año) (Esmeralda Neón) -->
            <div class="historial-summary-card card-vigencia p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/40 dark:bg-white/[0.03] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-11 h-11 rounded-2xl bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 flex items-center justify-center flex-shrink-0 text-lg font-bold border border-emerald-500/30">
                <i class="fa-solid fa-circle-check"></i>
              </div>
              <div class="min-w-0 flex-1">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Vigencia Inducción</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white truncate mt-0.5" x-text="formatearFechaLegible(obtenerFechaMasUnAnio(formInduccion.fecha_induccion))"></p>
                <span class="text-[11px] text-emerald-400 font-semibold block leading-tight mt-0.5 drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]">Vigente (365d)</span>
              </div>
            </div>

          </div>

          <!-- Fechas de la Renovación (Solo lectura / Fijo a Hoy con Estilo Neón) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div class="historial-summary-card card-responsable p-3.5 sm:p-4 rounded-2xl bg-[#efe9dc]/35 dark:bg-white/[0.025] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-10 h-10 rounded-xl bg-indigo-500/15 text-indigo-500 dark:text-indigo-400 flex items-center justify-center flex-shrink-0 text-base font-bold border border-indigo-500/25">
                <i class="fa-solid fa-calendar-check"></i>
              </div>
              <div class="min-w-0">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Fecha Realización Curso</span>
                <div class="flex items-center gap-2 mt-0.5">
                  <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white" x-text="formatearFechaLegible(formInduccion.fecha_induccion) || formInduccion.fecha_induccion"></p>
                  <span class="text-[10px] text-indigo-400 font-medium flex items-center gap-1">
                    <i class="fa-solid fa-lock text-[8px] opacity-70"></i> Hoy
                  </span>
                </div>
              </div>
            </div>

            <div class="historial-summary-card card-vigencia p-3.5 sm:p-4 rounded-2xl bg-[#efe9dc]/35 dark:bg-white/[0.025] border border-[var(--paper-shadow)] flex items-center gap-3.5 transition-all duration-300">
              <div class="summary-icon-box w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 flex items-center justify-center flex-shrink-0 text-base font-bold border border-emerald-500/25">
                <i class="fa-solid fa-hourglass-half"></i>
              </div>
              <div class="min-w-0">
                <span class="subtitles-modal text-[10px] font-bold uppercase tracking-wider block">Nueva Fecha Límite (+1 Año)</span>
                <p class="text-sm font-bold text-[var(--paper-ink)] dark:text-white block mt-0.5" x-text="formatearFechaLegible(obtenerFechaMasUnAnio(formInduccion.fecha_induccion))"></p>
              </div>
            </div>
          </div>

          <!-- Anotaciones y Observaciones del Curso -->
          <div class="p-4 sm:p-4.5 rounded-2xl bg-[#efe9dc]/35 dark:bg-white/[0.025] border border-[var(--paper-shadow)] dark:border-white/[0.05] space-y-2">
            <div class="flex items-center justify-between border-b border-dashed border-[var(--paper-shadow)] pb-2.5">
              <h4 class="font-display font-semibold text-xs sm:text-sm text-[var(--paper-ink)] dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap text-purple-600 dark:text-purple-400"></i>
                <span>Observaciones / Temas del Curso</span>
              </h4>
              <span class="text-[10px] text-[var(--paper-muted)] dark:text-slate-400">Opcional</span>
            </div>

            <div>
              <textarea x-model="formInduccion.anotaciones" rows="3" placeholder="Ej: Aprobó inducción general y de planta. Temas de seguridad y políticas INCARSA..."
                class="input-field w-full p-3 text-xs rounded-xl border border-[var(--paper-shadow)] dark:border-white/[0.06] bg-[#efe9dc]/50 dark:bg-white/[0.02] text-[var(--paper-ink)] dark:text-slate-200 resize-none"></textarea>
            </div>
          </div>

        </div>

        <!-- Pie -->
        <div class="flex items-center justify-center gap-3 pt-3">
          <button type="button" @click="cerrarFormularioInduccion()"
            class="modal-btn-cancel px-7 py-2.5 text-sm font-semibold">
            Volver al Detalle
          </button>
          
          <button type="button" @click="guardarInduccion()" :disabled="guardandoInduccion"
            class="rounded-lg px-7 py-2.5 text-sm font-semibold flex items-center gap-2 shadow-sm bg-purple-600 hover:bg-purple-700 text-white transition-all"
            :class="guardandoInduccion ? 'opacity-60 cursor-not-allowed' : ''">
            <i class="fa-solid" :class="guardandoInduccion ? 'fa-spinner fa-spin' : 'fa-check-double'"></i>
            <span x-text="guardandoInduccion ? 'Guardando...' : 'Guardar y Renovar Vigencia (+1 Año)'"></span>
          </button>
        </div>

        <div class="modal-serrated"></div>
      </div>
    </div>
