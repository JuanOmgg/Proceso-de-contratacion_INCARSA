<!-- ============================================================
   MODAL: Ver solicitud (Detalle completo - Componente Compartido)
   Estilo SweetAlert / Ticket Limpio con Pie Fijo
============================================================= -->
<div x-show="viewModalOpen" x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto modal-backdrop"
  @keydown.escape.window="closeView()">
  <div x-show="viewModalOpen" x-transition @click.outside="closeView()"
    class="modal-panel w-full max-w-2xl my-auto pt-7 px-6 sm:px-8 pb-9 relative text-center" x-cloak>
    
    <!-- Botón cerrar superior derecho -->
    <button type="button" @click="closeView()"
      class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center text-[var(--paper-muted)] hover:text-[var(--paper-ink)] hover:bg-black/5 dark:hover:bg-white/10 transition-all z-20 cursor-pointer"
      title="Cerrar modal">
      <i class="fa-solid fa-xmark text-base"></i>
    </button>

    <template x-if="selected">
      <div class="text-left">
        <!-- Cabecera estilo SweetAlert (Fija) -->
        <div class="text-center mb-3">
          <div class="modal-stamp info mb-2.5">
            <i class="fa-solid fa-file-contract text-2xl text-[var(--paper-info)]"></i>
          </div>
          <h2 class="font-display font-bold text-2xl text-[var(--paper-ink)] tracking-tight mb-1" x-text="selected.empresaOrigen || 'Detalle de Solicitud'"></h2>
          <div class="flex items-center justify-center gap-2 mt-1">
            <span class="status-pill inline-flex select-none shadow-xs font-semibold" :class="estadoClass(selected.estado)"
              x-text="selected.estado"></span>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md font-mono font-bold text-xs bg-[#efe9dc] text-[var(--paper-ink)] border border-[var(--paper-shadow)] dark:bg-slate-900/90 dark:text-cyan-300 dark:border-cyan-500/30 group shadow-xs">
              <i class="fa-solid fa-hashtag text-[10px] text-[var(--paper-muted)] dark:text-cyan-400"></i>
              <span x-text="selected.codigo || ('RAD-' + selected.id)" class="tracking-wide"></span>
              <button type="button" @click="copiarTexto(selected.codigo)" 
                class="text-[var(--paper-muted)] hover:text-[var(--paper-ink)] dark:text-slate-400 dark:hover:text-cyan-200 ml-1 opacity-70 hover:opacity-100 transition-all cursor-pointer" 
                data-tooltip="Copiar código" title="Copiar código">
                <i class="fa-regular fa-copy text-[11px]"></i>
              </button>
              <button type="button" 
                x-show="typeof openQrModal === 'function'"
                @click="openQrModal(selected)" 
                class="text-cyan-600 hover:text-cyan-700 dark:text-cyan-400 dark:hover:text-cyan-300 ml-1 opacity-80 hover:opacity-100 transition-all cursor-pointer" 
                data-tooltip="Ver pase y QR" title="Ver pase y QR">
                <i class="fa-solid fa-qrcode text-[12px]"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Contenedor scrollable para contenido largo -->
        <div class="max-h-[58vh] overflow-y-auto custom-scroll pr-1.5 space-y-3">
          <!-- 1. Datos generales estilo Ticket con líneas punteadas -->
          <div class="border-y border-dashed border-[var(--paper-shadow)] py-2 space-y-0">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 py-2 border-b border-dashed border-[var(--paper-shadow)]">
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Empresa origen</span>
                <span class="text-sm font-semibold text-[var(--paper-ink)]" x-text="selected.empresaOrigen || '—'"></span>
              </div>
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Contratista</span>
                <span class="text-sm font-semibold text-[var(--paper-ink)]" x-text="selected.nombre_emContratista || '—'"></span>
              </div>
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Nivel de riesgo</span>
                <span class="text-sm font-semibold text-[var(--paper-ink)]" x-text="selected.riesgo || '—'"></span>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 py-2 border-b border-dashed border-[var(--paper-shadow)]">
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Fecha ingreso</span>
                <span class="text-xs font-semibold text-[var(--paper-ink)]" x-text="selected.fechaIngreso || '—'"></span>
              </div>
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Fecha salida</span>
                <span class="text-xs font-semibold text-[var(--paper-ink)]" x-text="selected.fechaSalida || '—'"></span>
              </div>
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Fecha registro</span>
                <span class="text-xs font-semibold text-[var(--paper-ink)]" x-text="selected.fecha_creacion || '—'"></span>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 py-2">
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Plantas a visitar</span>
                <span class="text-xs font-semibold text-[var(--paper-ink)]" x-text="selected.planta || '—'"></span>
              </div>
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Actividad</span>
                <span class="text-xs font-semibold text-[var(--paper-ink)]" x-text="selected.actividad || '—'"></span>
              </div>
              <div>
                <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block">Solicitado por</span>
                <span class="text-xs font-semibold text-[var(--paper-ink)]" x-text="selected.diligenciador || '—'"></span>
              </div>
            </div>

            <div class="pt-2 border-t border-dashed border-[var(--paper-shadow)]" x-show="selected.observaciones">
              <span class="text-[10.5px] font-bold tracking-wider text-[var(--paper-muted)] uppercase block mb-1">Observaciones registradas:</span>
              <p class="text-xs text-[var(--paper-text)] leading-relaxed" x-text="selected.observaciones"></p>
            </div>
          </div>

          <!-- 2. Personas / Ingresantes -->
          <div class="py-2 border-b border-dashed border-[var(--paper-shadow)]">
            <span class="subtitles-modal ticket-section-title text-[10.5px] font-bold uppercase tracking-wider text-[var(--paper-muted)] block mb-2">
              Personas registradas
            </span>

            <template x-if="!selected?.personas || selected?.personas?.length === 0">
              <p class="text-xs ticket-empty-msg italic py-2 text-center">Sin personas registradas.</p>
            </template>

            <template x-if="selected?.personas && selected?.personas?.length > 0">
              <div class="ticket-table-wrapper overflow-x-auto rounded-xl border border-[var(--paper-shadow)]">
                <table class="w-full text-xs ticket-table">
                  <thead>
                    <tr class="ticket-th-row font-bold border-b border-[var(--paper-shadow)]">
                      <th class="px-2.5 py-2 text-center">#</th>
                      <th class="px-2.5 py-2 text-center">Apellidos y nombres</th>
                      <th class="px-2.5 py-2 text-center">Doc.</th>
                      <th class="px-2.5 py-2 text-center">Identificación</th>
                      <th class="px-2.5 py-2 text-center">Cargo</th>
                      <th class="px-2.5 py-2 text-center">Autorizado</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-dashed ticket-tbody">
                    <template x-for="(p, index) in (selected?.personas || [])" :key="p.id || index">
                      <tr class="ticket-tr transition-colors">
                        <td class="px-2.5 py-2 text-center font-medium ticket-td-muted" x-text="index + 1"></td>
                        <td class="px-2.5 py-2 text-center font-semibold ticket-td-primary" x-text="p.ap_nombre || p.nombre || '-'"></td>
                        <td class="px-2.5 py-2 text-center ticket-td-muted" x-text="p.tipo_doc || '-'"></td>
                        <td class="px-2.5 py-2 text-center font-mono ticket-td-code" x-text="p.identificacion || '-'"></td>
                        <td class="px-2.5 py-2 text-center ticket-td-text" x-text="p.cargo || '-'"></td>
                        <td class="px-2.5 py-2 text-center">
                          <!-- 1. VERDE: Autorizado completo (ingreso avalado + datos aprobados) -->
                          <template x-if="(p.autorizado == 1 || p.autorizado === true || p.autorizado === '1') && p.estado_datos === 'AUTORIZADO'">
                            <span class="inline-flex items-center justify-center ticket-status-auth cursor-help"
                              title="Autorizado: Ingreso avalado y tratamiento de datos aprobado">
                              <i class="fa-solid fa-circle-check text-base"></i>
                            </span>
                          </template>

                          <!-- 2. AMARILLO: Autorizado pero PENDIENTE de tratamiento de datos -->
                          <template x-if="(p.autorizado == 1 || p.autorizado === true || p.autorizado === '1') && p.estado_datos !== 'AUTORIZADO' && p.estado_datos !== 'RECHAZADO'">
                            <span class="inline-flex items-center justify-center ticket-status-warn cursor-help"
                              title="Pendiente: Aún no ha aprobado el tratamiento de datos personales (Ley 1581/2012)">
                              <i class="fa-solid fa-circle-exclamation text-base"></i>
                            </span>
                          </template>

                          <!-- 3. ROJO: No autorizado (o rechazó tratamiento de datos) -->
                          <template x-if="!(p.autorizado == 1 || p.autorizado === true || p.autorizado === '1') || p.estado_datos === 'RECHAZADO'">
                            <span class="inline-flex items-center justify-center ticket-status-unauth cursor-help"
                              :title="p.motivo ? ('No Autorizado: ' + p.motivo) : (p.estado_datos === 'RECHAZADO' ? 'No Autorizado: Tratamiento de datos rechazado por el titular' : 'No autorizado')">
                              <i class="fa-solid fa-circle-xmark text-base"></i>
                            </span>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>

          <!-- 3. Vehículos y Equipos de cómputo -->
          <div class="grid md:grid-cols-2 gap-4 py-2">
            <!-- Vehículos -->
            <div>
              <span class="subtitles-modal ticket-section-title text-[10.5px] font-bold uppercase tracking-wider text-[var(--paper-muted)] block mb-1.5">
                Vehículos
              </span>
              <template x-if="!selected?.vehiculos || selected?.vehiculos?.length === 0">
                <p class="text-xs ticket-empty-msg italic py-1">No se registraron vehículos.</p>
              </template>
              <ul class="space-y-1.5 text-xs" x-show="selected?.vehiculos && selected?.vehiculos?.length > 0">
                <template x-for="(v, i) in (selected?.vehiculos || [])" :key="v.id || i">
                  <li class="ticket-card-item border border-[var(--paper-shadow)] rounded-xl p-2.5 space-y-1.5">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-1.5">
                        <span class="ticket-placa-badge font-bold font-mono text-[11px] uppercase px-1.5 py-0.5 rounded border border-[var(--paper-shadow)]"
                          x-text="v.placa || 'Sin placa'"></span>
                        <span class="ticket-card-title text-[11px] font-semibold" x-text="v.tipo || 'Vehículo'"></span>
                      </div>
                      <div class="flex items-center">
                        <template x-if="v.autorizado == 1 || v.autorizado === true || v.autorizado === '1'">
                          <span class="inline-flex items-center justify-center ticket-status-auth" title="Vehículo Autorizado">
                            <i class="fa-solid fa-circle-check text-sm"></i>
                          </span>
                        </template>
                        <template x-if="!(v.autorizado == 1 || v.autorizado === true || v.autorizado === '1')">
                          <span class="inline-flex items-center justify-center ticket-status-unauth" 
                            :title="v.motivo ? ('No Autorizado: ' + v.motivo) : 'Vehículo no autorizado'">
                            <i class="fa-solid fa-circle-xmark text-sm"></i>
                          </span>
                        </template>
                      </div>
                    </div>
                    <div x-show="v.conductor || v.licencia_doc || v.licencia" class="text-[11px] ticket-card-sub flex items-center gap-1.5">
                      <i class="fa-solid fa-id-card text-emerald-500 text-[10px]"></i>
                      <span x-text="v.conductor ? v.conductor + ':' : 'Lic:'"></span>
                      <span class="truncate font-medium ticket-card-doc" x-text="v.licencia_doc || v.licencia || 'Asignado'"></span>
                    </div>
                    <div x-show="!(v.autorizado == 1 || v.autorizado === true || v.autorizado === '1') && v.motivo" class="text-[10px] ticket-card-error font-medium italic flex items-center gap-1">
                      <i class="fa-solid fa-circle-exclamation text-[9px]"></i>
                      <span x-text="'Motivo: ' + v.motivo"></span>
                    </div>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Equipos de Cómputo -->
            <div>
              <span class="subtitles-modal ticket-section-title text-[10.5px] font-bold uppercase tracking-wider text-[var(--paper-muted)] block mb-1.5">
                Equipos de cómputo
              </span>
              <template x-if="!selected?.computos || selected?.computos?.length === 0">
                <p class="text-xs ticket-empty-msg italic py-1">No se declararon equipos.</p>
              </template>
              <ul class="space-y-1.5 text-xs" x-show="selected?.computos && selected?.computos?.length > 0">
                <template x-for="(e, index) in (selected?.computos || [])" :key="e.id || index">
                  <li class="ticket-card-item flex items-center justify-between p-2.5 rounded-xl border border-[var(--paper-shadow)]">
                    <div class="flex items-center gap-2">
                      <i class="fa-solid fa-laptop text-[11px] text-cyan-400"></i>
                      <span class="ticket-card-title font-semibold text-xs" x-text="(e.marca || '') + ' ' + (e.modelo || '')"></span>
                    </div>
                    <span class="ticket-td-code font-mono text-xs" x-text="'Serie: ' + (e.serie || '—')"></span>
                  </li>
                </template>
              </ul>
            </div>
          </div>

          <!-- 4. Historial de Aprobaciones y Dictámenes -->
          <div class="py-2 border-t border-dashed border-[var(--paper-shadow)]">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10.5px] font-bold uppercase tracking-wider text-[var(--paper-muted)] flex items-center gap-1.5">
                <i class="fa-solid fa-stamp text-[11px] text-[#2f8f5b]"></i>
                Aprobación y Dictámenes
              </span>
              <!-- Resumen rápido de autorizaciones -->
              <div class="flex items-center gap-2 text-[10.5px]">
                <span class="font-medium text-[var(--paper-ink)]" x-show="selected?.personas?.length > 0">
                  <i class="fa-solid fa-user-check text-[10px] text-[#2f8f5b] mr-0.5"></i>
                  <span x-text="(selected?.personas || []).filter(p => (p.autorizado == 1 || p.autorizado === true || p.autorizado === '1') && p.estado_datos === 'AUTORIZADO').length + '/' + (selected?.personas?.length || 0) + ' personas aut.'"></span>
                </span>
                <span class="font-medium text-[var(--paper-ink)]" x-show="selected?.vehiculos?.length > 0">
                  <i class="fa-solid fa-car-side text-[10px] text-[#2f8f5b] mr-0.5"></i>
                  <span x-text="(selected?.vehiculos || []).filter(v => v.autorizado == 1 || v.autorizado === true || v.autorizado === '1').length + '/' + (selected?.vehiculos?.length || 0) + ' veh. aut.'"></span>
                </span>
              </div>
            </div>

            <!-- Tarjeta de dictámenes por revisor -->
            <template x-if="selected?.revisiones && selected?.revisiones?.length > 0">
              <div class="space-y-2">
                <template x-for="(rev, rIdx) in selected.revisiones" :key="rev.id || rIdx">
                  <div class="ticket-dictamen-item border rounded-xl p-3 transition-all flex flex-col gap-1.5"
                    :class="rev.decision === 'APROBADO' ? 'is-aprobado' : (rev.decision === 'RECHAZADO' ? 'is-rechazado' : 'is-pendiente')">
                    <div class="flex items-center justify-between gap-2 flex-wrap">
                      <div class="flex items-center gap-2 flex-wrap min-w-0">
                        <span class="ticket-role-badge px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider"
                          :class="{
                            'role-sst': rev.rol === 'SST',
                            'role-gesco': rev.rol === 'GESCO',
                            'role-scr': rev.rol === 'SCR'
                          }"
                          x-text="rev.rol || 'REVISOR'">
                        </span>
                        <span class="text-xs font-bold ticket-revisor-name" x-text="rev.nombre_revisor || 'Revisor'"></span>
                        <span x-show="rev.nombre_planta || rev.planta" class="text-[10.5px] ticket-planta-tag font-medium" x-text="'(' + (rev.nombre_planta || rev.planta) + ')'"></span>
                      </div>
                      <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="status-pill inline-flex items-center gap-1.5 select-none font-bold text-[10px] px-2.5 py-0.5 rounded-full"
                          :class="estadoClass(rev.decision)">
                          <i x-show="rev.rol === 'SCR' && (rev.es_preaprobado || selected?.pre_aprobado)"
                            class="fa-solid fa-bolt text-amber-400 text-[11px] drop-shadow-[0_0_4px_rgba(251,191,36,0.6)]"
                            title="Aprobado automáticamente vía Pre-aprobación"></i>
                          <span x-text="rev.decision || 'REVISADO'"></span>
                        </span>
                        <span class="text-[10.5px] font-mono ticket-fecha opacity-85" x-text="formatearFechaHoraEspanol(rev.fecha_revision)"></span>
                      </div>
                    </div>
                    <p x-show="rev.observacion && rev.observacion.trim() !== '' && !rev.observacion.includes('Aprobación definitiva automática')" class="text-xs ticket-obs mt-0.5 pl-2.5 border-l-2 italic" x-text="rev.observacion"></p>
                    <p x-show="rev.motivo_rechazo" class="text-xs ticket-rechazo font-medium mt-0.5 pl-2.5 border-l-2" x-text="'Motivo: ' + rev.motivo_rechazo"></p>
                  </div>
                </template>
              </div>
            </template>

            <!-- Si no hay dictámenes detallados pero la solicitud ya tiene estado APROBADO o PRE-APROBADO -->
            <template x-if="(!selected?.revisiones || selected?.revisiones?.length === 0) && (selected?.estado === 'APROBADO' || selected?.estado === 'PRE-APROBADO')">
              <div class="flex items-center gap-3 p-2.5 rounded-lg border border-[#2f8f5b]/40 bg-[#2f8f5b]/10 text-xs">
                <i class="fa-solid fa-circle-check text-base text-[#2f8f5b] shrink-0"></i>
                <div class="text-left">
                  <span class="font-bold text-[#2f8f5b] block text-[12px]">Solicitud Aprobada</span>
                  <span class="text-[var(--paper-text)] text-[11px]">Esta solicitud cuenta con la autorización requerida para el ingreso a planta.</span>
                </div>
              </div>
            </template>

            <!-- Si está RECHAZADO sin revisiones -->
            <template x-if="(!selected?.revisiones || selected?.revisiones?.length === 0) && selected?.estado === 'RECHAZADO'">
              <div class="flex items-center gap-3 p-2.5 rounded-lg border border-[#c1443c]/40 bg-[#c1443c]/10 text-xs">
                <i class="fa-solid fa-circle-xmark text-base text-[#c1443c] shrink-0"></i>
                <div class="text-left">
                  <span class="font-bold text-[#c1443c] block text-[12px]">Solicitud Rechazada</span>
                  <span class="text-[var(--paper-text)] text-[11px]" x-text="selected?.observaciones ? ('Motivo: ' + selected.observaciones) : 'La solicitud no fue autorizada para el ingreso.'"></span>
                </div>
              </div>
            </template>

            <!-- Si está pendiente y no hay dictámenes aún -->
            <template x-if="(!selected?.revisiones || selected?.revisiones?.length === 0) && selected?.estado !== 'APROBADO' && selected?.estado !== 'PRE-APROBADO' && selected?.estado !== 'RECHAZADO'">
              <div class="flex items-center gap-3 p-2 rounded-lg border border-dashed border-[var(--paper-shadow)] bg-[#efe9dc]/30 text-xs text-[var(--paper-muted)]">
                <i class="fa-solid fa-clock-rotate-left text-sm shrink-0"></i>
                <span>Pendiente de revisión y dictamen por los roles correspondientes (SST, GESCO, SCR).</span>
              </div>
            </template>
          </div>
        </div>

        <!-- Botones de Acción SweetAlert Style (Fijos en la parte inferior) -->
        <div class="flex items-center justify-center gap-3 pt-3.5 mt-2 border-t border-dashed border-[var(--paper-shadow)] flex-wrap">
          <button type="button" @click="closeView()" class="modal-btn-cancel px-6 py-2.5 cursor-pointer">
            Cerrar
          </button>
          
          <!-- Botón: Revisar expediente (Visible si tiene permiso de aprobar en dashboard o solicitudes) -->
          <a :href="selected ? ('/solicitudes/revision/' + (selected.codigo || selected.id)) : '#'"
            x-show="typeof puedeAccion === 'function' && (puedeAccion('dashboard', 'aprobar') || puedeAccion('solicitudes', 'aprobar'))"
            class="px-6 py-2.5 rounded-xl font-semibold text-xs flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-900/30 transition-all cursor-pointer">
            <i class="fa-solid fa-clipboard-check text-xs"></i>
            <span>Revisar expediente</span>
          </a>

          <!-- Botón: Editar solicitud (Visible si el usuario tiene permiso para editarla) -->
          <a :href="selected ? ('/solicitudes/editar/' + (selected.codigo || selected.id)) : '#'"
            x-show="typeof puedeEditarSolicitud === 'function' && puedeEditarSolicitud(selected)"
            class="px-6 py-2.5 rounded-xl font-semibold text-xs flex items-center gap-2 bg-amber-600 hover:bg-amber-500 text-white shadow-md shadow-amber-900/30 transition-all cursor-pointer">
            <i class="fa-solid fa-pen-to-square text-xs"></i>
            <span>Editar solicitud</span>
          </a>
        </div>

      </div>
    </template>

    <!-- Borde dentado fijo al pie de la tarjeta -->
    <div class="modal-serrated"></div>
  </div>
</div>
