<!-- ============================================================
   MODAL: Pase y Código QR de Portería (Componente Compartido)
============================================================= -->
<div x-show="qrModalOpen" x-cloak
  class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto"
  @keydown.escape.window="cerrarQrModal()">
  <div class="modal-panel w-full max-w-md my-auto pt-7 px-6 sm:px-8 pb-8 relative text-center" @click.outside="cerrarQrModal()">
    <!-- Botón cerrar superior derecho -->
    <button type="button" @click="cerrarQrModal()"
      class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center text-[var(--paper-muted)] hover:text-[var(--paper-ink)] hover:bg-black/5 dark:hover:bg-white/10 transition-all z-20 cursor-pointer"
      title="Cerrar">
      <i class="fa-solid fa-xmark text-base"></i>
    </button>

    <div class="text-center mb-4">
      <div class="modal-stamp info mb-2.5">
        <i class="fa-solid fa-qrcode text-2xl text-[var(--paper-info)]"></i>
      </div>
      <h3 class="font-display font-bold text-xl sm:text-2xl text-[var(--paper-ink)] tracking-tight mb-1">Pase y Código QR de Portería</h3>
      <p class="text-xs text-[var(--paper-muted)] font-mono font-bold" x-text="selectedQr ? (selectedQr.codigo || ('RAD-' + selectedQr.id)) : ''"></p>
    </div>

    <template x-if="selectedQr">
      <div class="space-y-4 text-left">
        <!-- Imagen QR de alta resolución con fondo blanco nítido -->
        <div class="flex flex-col items-center justify-center p-4 rounded-2xl bg-white dark:bg-black/40 border border-[var(--paper-shadow)] shadow-inner">
          <div class="p-2.5 bg-white rounded-xl shadow-xs border border-slate-200 inline-block">
            <img :src="'/api/v1/solicitudes/' + encodeURIComponent(selectedQr.codigo || ('RAD-' + selectedQr.id)) + '/qr'" 
                 :alt="'Pase QR ' + (selectedQr.codigo || selectedQr.id)" 
                 class="max-w-[260px] sm:max-w-[300px] w-full h-auto object-contain rounded-lg select-none shadow-xs"
                 loading="lazy" />
          </div>
          <p class="text-[11px] text-center text-slate-500 dark:text-slate-400 mt-2.5 max-w-xs font-medium">
            Escanea con el celular en portería para verificar el acceso y lista de autorizados al instante.
          </p>
        </div>

        <!-- Resumen esencial de la solicitud -->
        <div class="p-3 rounded-xl bg-[#faf7f0] dark:bg-black/20 border border-[var(--paper-shadow)] space-y-1.5 text-xs">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[10px] font-bold text-[var(--paper-muted)] uppercase">Empresa:</span>
            <span class="font-bold text-[var(--paper-ink)] truncate max-w-[220px]" x-text="selectedQr.nombre_emContratista || selectedQr.nombre_empresa || selectedQr.empresaOrigen || '—'"></span>
          </div>
          <div class="flex items-center justify-between gap-2">
            <span class="text-[10px] font-bold text-[var(--paper-muted)] uppercase">Vigencia:</span>
            <span class="font-mono font-semibold text-[var(--paper-ink)]" x-text="(selectedQr.fecha_ingreso || selectedQr.fechaIngreso || '—') + ' → ' + (selectedQr.fecha_salida || selectedQr.fechaSalida || '—')"></span>
          </div>
          <div class="flex items-center justify-between gap-2 pt-1 border-t border-dashed border-[var(--paper-shadow)]">
            <span class="text-[10px] font-bold text-[var(--paper-muted)] uppercase">Estado:</span>
            <span class="status-pill inline-flex text-[10px] font-bold px-2 py-0.5" :class="estadoClass(selectedQr.estado)" x-text="selectedQr.estado"></span>
          </div>
        </div>

        <!-- Acciones -->
        <div class="space-y-2.5 pt-2 border-t border-dashed border-[var(--paper-shadow)]">
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" @click="descargarQr()"
              class="py-2.5 px-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-semibold text-xs shadow-md shadow-cyan-900/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer group">
              <i class="fa-solid fa-download text-xs group-hover:-translate-y-0.5 transition-transform"></i>
              <span>Descargar PNG</span>
            </button>

            <button type="button" @click="copiarEnlaceQr()"
              :class="copiadoToast ? 'border-emerald-500/50 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'border-slate-200 dark:border-white/10 bg-slate-50 hover:bg-slate-100 dark:bg-white/5 dark:hover:bg-white/10 text-[var(--paper-ink)]'"
              class="py-2.5 px-3 rounded-xl border font-semibold text-xs shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
              <i class="fa-solid text-xs transition-transform" :class="copiadoToast ? 'fa-check text-emerald-500 scale-110' : 'fa-link text-cyan-500 dark:text-cyan-400'"></i>
              <span x-text="copiadoToast ? '¡Copiado!' : 'Copiar Enlace'">Copiar Enlace</span>
            </button>
          </div>

          <!-- Acceso a vista de verificación en portería -->
          <a :href="'/verificar/' + encodeURIComponent(selectedQr.codigo || ('RAD-' + selectedQr.id))" target="_blank"
            class="w-full py-2.5 px-3.5 rounded-xl border border-cyan-500/30 hover:border-cyan-500/60 bg-gradient-to-r from-cyan-500/10 via-sky-500/10 to-blue-500/10 hover:from-cyan-500/20 hover:to-blue-500/20 text-cyan-700 dark:text-cyan-300 hover:text-cyan-800 dark:hover:text-cyan-200 font-semibold text-xs shadow-sm hover:shadow-md hover:shadow-cyan-500/10 transition-all flex items-center justify-between group cursor-pointer">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-6 h-6 rounded-lg bg-cyan-500/20 text-cyan-600 dark:text-cyan-400 flex items-center justify-center text-xs group-hover:scale-110 transition-transform shrink-0">
                <i class="fa-solid fa-shield-halved"></i>
              </div>
              <span class="truncate">Abrir vista de verificación de portería</span>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square text-[11px] opacity-70 group-hover:opacity-100 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all shrink-0"></i>
          </a>
        </div>
      </div>
    </template>

    <div class="modal-serrated"></div>
  </div>
</div>
