<!-- ===== Modal: Registrar nuevo vehículo ===== -->
          <div x-show="showVehiculoModal" x-cloak
            class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop"
            @keydown.escape.window="closeVehiculoModal()"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0">
            <div x-show="showVehiculoModal"
              @click.outside="closeVehiculoModal()"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0 scale-95 -translate-y-4"
              x-transition:enter-end="opacity-100 scale-100 translate-y-0"
              x-transition:leave="transition ease-in duration-200"
              x-transition:leave-start="opacity-100 scale-100 translate-y-0"
              x-transition:leave-end="opacity-0 scale-95 -translate-y-4"
              class="modal-panel modal-ticket w-full max-w-lg pt-7 px-6 sm:px-8 pb-9 relative text-left" x-cloak>

              <!-- Botón cerrar superior derecho -->
              <button type="button" @click="closeVehiculoModal()"
                class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center text-[var(--paper-muted)] hover:text-[var(--paper-ink)] hover:bg-black/5 transition-all z-20"
                title="Cerrar modal">
                <i class="fa-solid fa-xmark text-base"></i>
              </button>

              <!-- Header estilo Ticket -->
              <div class="flex items-center gap-3.5 mb-4">
                <div class="w-11 h-11 rounded-xl bg-red-500/15 border border-red-500/30 text-red-600 flex items-center justify-center font-bold text-lg flex-shrink-0 shadow-sm">
                  <i class="fa-solid" :class="isEditingVehiculo ? 'fa-pen-to-square' : 'fa-truck-pickup'"></i>
                </div>
                <div class="min-w-0">
                  <h3 class="font-display font-bold text-lg text-[var(--paper-ink)] truncate"
                    x-text="isEditingVehiculo ? 'Editar vehículo' : 'Registrar nuevo vehículo'"></h3>
                  <p class="text-xs text-[var(--paper-muted)] truncate"
                    x-text="isEditingVehiculo ? 'Actualiza los datos del automotor, conductor y documentación' : 'Datos del automotor, conductor y documentación'"></p>
                </div>
              </div>

              <div class="grid sm:grid-cols-2 gap-3 max-h-[70vh] overflow-y-auto pr-1">
                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Tipo de vehículo</label>
                  <select x-model="nuevoVehiculo.tipo"
                    x-effect="$nextTick(() => { if ($el && nuevoVehiculo && nuevoVehiculo.tipo) $el.value = nuevoVehiculo.tipo; })"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20"
                    :class="vehiculoModalErrors.tipo ? 'has-error' : ''">
                    <template x-for="tipo in tiposVehiculo" :key="tipo">
                      <option :value="tipo"
                        :selected="nuevoVehiculo.tipo && nuevoVehiculo.tipo.toLowerCase().trim() === tipo.toLowerCase().trim()"
                        x-text="tipo"></option>
                    </template>
                  </select>
                  <p class="form-error" x-show="vehiculoModalErrors.tipo" x-text="vehiculoModalErrors.tipo"></p>
                </div>

                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Placa</label>
                  <input type="text" x-model="nuevoVehiculo.placa"
                    @input="nuevoVehiculo.placa = nuevoVehiculo.placa.toUpperCase().replace(/[^A-Z0-9]/g, '')"
                    placeholder="Ej: ABC123"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm font-mono font-semibold uppercase bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20"
                    :class="vehiculoModalErrors.placa ? 'has-error' : ''">
                  <p class="form-error" x-show="vehiculoModalErrors.placa" x-text="vehiculoModalErrors.placa"></p>
                </div>

                <div class="sm:col-span-2">
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Conductor asignado (Opcional)</label>
                  <template x-if="personas.length > 0">
                    <select :value="nuevoVehiculo.id_persona || ''"
                      @change="asignarConductorVehiculo(nuevoVehiculo, $event)"
                      x-effect="$nextTick(() => { if ($el && nuevoVehiculo) $el.value = nuevoVehiculo.id_persona || ''; })"
                      class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20">
                      <option value="">-- Seleccionar de personas de la solicitud --</option>
                      <template x-for="p in personas" :key="p.id || p.numDoc || p.identificacion">
                        <option :value="p.id"
                          :selected="nuevoVehiculo.id_persona && String(nuevoVehiculo.id_persona) === String(p.id)"
                          x-text="p.nombres + ' (' + (p.cargo || 'Personal') + ')'"></option>
                      </template>
                    </select>
                  </template>
                  <template x-if="personas.length === 0">
                    <input type="text" x-model="nuevoVehiculo.conductor" placeholder="Nombre completo del conductor..."
                      class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20">
                  </template>
                </div>
                <!-- Licencia de conducción del conductor -->
                <div class="sm:col-span-2 p-3 rounded-xl bg-[#efe9dc]/50 dark:bg-white/[0.04] border border-[var(--paper-shadow)] space-y-1.5">
                  <div class="flex items-center justify-between">
                    <label class="form-label mb-0 text-xs font-semibold text-[var(--paper-ink)] flex items-center gap-1.5">
                      <i class="fa-solid fa-id-card text-red-600 text-xs"></i>
                      Licencia de conducción del conductor
                    </label>
                    <span class="text-[10px] text-[var(--paper-muted)]">Opcional</span>
                  </div>

                  <template x-if="!nuevoVehiculo.licencia_doc">
                    <label
                      class="w-full cursor-pointer flex items-center justify-between border border-dashed border-[var(--paper-shadow)] hover:border-red-500 rounded-lg px-3 py-2 text-xs bg-white transition group">
                      <span class="truncate text-[var(--paper-muted)] group-hover:text-[var(--paper-ink)]">Adjuntar licencia (PDF/Foto)...</span>
                      <i class="fa-solid fa-cloud-arrow-up text-red-500 ml-2 text-xs flex-shrink-0"></i>
                      <input type="file" accept="application/pdf,.pdf,image/*"
                        @change="handleLicenciaNuevoVehiculoFile($event)" class="hidden">
                    </label>
                  </template>

                  <template x-if="nuevoVehiculo.licencia_doc">
                    <div class="w-full flex items-center justify-between bg-white border border-emerald-300 rounded-lg px-3 py-2 text-xs">
                      <span class="truncate text-emerald-800 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-file-circle-check text-emerald-600 text-xs"></i>
                        <span class="truncate" x-text="nuevoVehiculo.licencia_doc"></span>
                      </span>
                      <button type="button" @click="removeLicenciaNuevoVehiculo()"
                        class="text-red-500 hover:text-red-700 ml-1 flex-shrink-0 text-xs" title="Quitar archivo">
                        <i class="fa-solid fa-xmark"></i>
                      </button>
                    </div>
                  </template>
                </div>

                <!-- Documentos del vehículo (SOAT, Tecnomecánica, etc.) -->
                <div class="sm:col-span-2 pt-2 border-t border-dashed border-[var(--paper-shadow)]">
                  <div class="flex items-center justify-between mb-2">
                    <div>
                      <label class="form-label mb-0 font-semibold text-xs text-[var(--paper-ink)]">Documentos del vehículo</label>
                      <p class="text-[11px] text-[var(--paper-muted)]">SOAT, Tecnomecánica, Tarjeta de Propiedad, etc.</p>
                    </div>
                    <button type="button" @click="addDocumentoNuevoVehiculo()"
                      class="btn-adjuntar-otro">
                      <i class="fa-solid fa-plus"></i> Adjuntar otro
                    </button>
                  </div>

                  <div class="space-y-2.5 mt-2">
                    <template x-for="(doc, dIdx) in nuevoVehiculo.documentos" :key="dIdx">
                      <div class="p-3 rounded-xl border border-[var(--paper-shadow)] bg-[#efe9dc]/50 dark:bg-white/[0.04] flex flex-col gap-2">
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                          <!-- Tipo de documento -->
                          <div class="w-full sm:w-1/2">
                            <select x-model="doc.tipo_doc"
                              class="input-field w-full rounded-lg px-2.5 py-1.5 text-xs bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)]">
                              <template x-for="t in tiposDocAdjuntoVehiculo" :key="t">
                                <option :value="t" x-text="t"></option>
                              </template>
                            </select>
                          </div>

                          <!-- Subir Archivo -->
                          <div class="flex-1 relative flex items-center min-w-0">
                            <label
                              class="w-full cursor-pointer flex items-center justify-between border border-dashed border-[var(--paper-shadow)] hover:border-red-500 rounded-lg px-3 py-1.5 text-xs bg-white transition">
                              <span class="truncate text-[var(--paper-ink)]"
                                x-text="doc.nombre_archivo || 'Seleccionar archivo (PDF)...'"></span>
                              <i class="fa-solid fa-cloud-arrow-up text-red-500 ml-2 text-xs flex-shrink-0"></i>
                              <input type="file" accept="application/pdf,.pdf,image/*"
                                @change="handleDocumentoNuevoVehiculoFile($event, dIdx)" class="hidden">
                            </label>
                          </div>

                          <!-- Botón eliminar fila -->
                          <button type="button" @click="removeDocumentoNuevoVehiculo(dIdx)"
                            class="action-icon-btn danger flex-shrink-0 self-end sm:self-auto" title="Eliminar fila">
                            <i class="fa-solid fa-trash text-xs"></i>
                          </button>
                        </div>

                        <!-- Input condicional para especificar 'Otro documento' -->
                        <div x-show="doc.tipo_doc === 'Otro documento' || doc.tipo_doc === 'Otro'"
                          x-transition:enter="transition ease-out duration-200"
                          x-transition:enter-start="opacity-0 -translate-y-1"
                          x-transition:enter-end="opacity-100 translate-y-0"
                          class="pt-1">
                          <input type="text" x-model="doc.tipo_doc_otro"
                            placeholder="Especifica qué tipo de documento es (ej: Tarjeta de Operación Especial, Póliza Todo Riesgo...)"
                            class="input-field w-full rounded-lg px-2.5 py-1.5 text-xs bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20">
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t border-dashed border-[var(--paper-shadow)]">
                <button type="button" @click="closeVehiculoModal()" :disabled="guardandoVehiculo"
                  class="modal-btn-cancel px-5 py-2.5 text-sm font-semibold">
                  Cancelar
                </button>
                <button type="button" @click="guardarNuevoVehiculo()" :disabled="guardandoVehiculo"
                  class="modal-btn-confirm px-6 py-2.5 text-sm font-semibold flex items-center gap-2">
                  <i class="fa-solid fa-circle-notch fa-spin text-xs" x-show="guardandoVehiculo"></i>
                  <span x-text="guardandoVehiculo ? 'Guardando...' : (isEditingVehiculo ? 'Actualizar vehículo' : 'Guardar vehículo')"></span>
                </button>
              </div>

              <!-- Borde dentado ticket visible al pie -->
              <div class="modal-serrated"></div>
            </div>
          </div>
