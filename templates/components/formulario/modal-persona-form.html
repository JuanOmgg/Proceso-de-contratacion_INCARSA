<!-- ===== Modal: Registrar nueva persona ===== -->
          <div x-show="showPersonaModal" x-cloak
            class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop"
            @keydown.escape.window="closePersonaModal()"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0">
            <div x-show="showPersonaModal"
              @click.outside="if (!$event.target.closest('.flatpickr-calendar')) closePersonaModal()"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0 scale-95 -translate-y-4"
              x-transition:enter-end="opacity-100 scale-100 translate-y-0"
              x-transition:leave="transition ease-in duration-200"
              x-transition:leave-start="opacity-100 scale-100 translate-y-0"
              x-transition:leave-end="opacity-0 scale-95 -translate-y-4"
              class="modal-panel modal-ticket w-full max-w-xl pt-7 px-6 sm:px-8 pb-9 relative text-left" x-cloak>

              <!-- Botón cerrar superior derecho -->
              <button type="button" @click="closePersonaModal()"
                class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center text-[var(--paper-muted)] hover:text-[var(--paper-ink)] hover:bg-black/5 transition-all z-20"
                title="Cerrar modal">
                <i class="fa-solid fa-xmark text-base"></i>
              </button>

              <!-- Header estilo Ticket -->
              <div class="flex items-center gap-3.5 mb-4">
                <div class="w-11 h-11 rounded-xl bg-red-500/15 border border-red-500/30 text-red-600 flex items-center justify-center font-bold text-lg flex-shrink-0 shadow-sm">
                  <i class="fa-solid" :class="isEditingPersona ? 'fa-user-pen' : 'fa-user-plus'"></i>
                </div>
                <div class="min-w-0">
                  <h3 class="font-display font-bold text-lg text-[var(--paper-ink)] truncate"
                    x-text="isEditingPersona ? 'Editar persona' : 'Registrar nueva persona'">Registrar nueva persona</h3>
                  <p class="text-xs text-[var(--paper-muted)] truncate"
                    x-text="isEditingPersona ? 'Actualiza los datos personales y documentos requeridos' : 'Información personal y documentos requeridos'">Información personal y documentos requeridos</p>
                </div>
              </div>

              <div class="grid sm:grid-cols-2 gap-3 max-h-[70vh] overflow-y-auto pr-1">
                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Apellidos</label>
                  <input type="text" x-model="nuevaPersona.apellidos" placeholder="Ej: Gómez Pérez"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20"
                    :class="personaModalErrors.apellidos ? 'has-error' : ''">
                  <p class="form-error" x-show="personaModalErrors.apellidos" x-text="personaModalErrors.apellidos"></p>
                </div>
                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Nombres</label>
                  <input type="text" x-model="nuevaPersona.nombres" placeholder="Ej: Carlos Andrés"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20"
                    :class="personaModalErrors.nombres ? 'has-error' : ''">
                  <p class="form-error" x-show="personaModalErrors.nombres" x-text="personaModalErrors.nombres"></p>
                </div>
                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Tipo doc.</label>
                  <select x-model="nuevaPersona.tipoDoc"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20">
                    <template x-for="tipo in tiposDocPersona" :key="tipo">
                      <option :value="tipo" x-text="tipo"></option>
                    </template>
                  </select>
                </div>
                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">N° documento</label>
                  <input type="text" x-model="nuevaPersona.numDoc" placeholder="Ej: 1032456789"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20"
                    :class="personaModalErrors.numDoc ? 'has-error' : ''">
                  <p class="form-error" x-show="personaModalErrors.numDoc" x-text="personaModalErrors.numDoc"></p>
                </div>
                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Cargo / Función</label>
                  <input type="text" x-model="nuevaPersona.cargo" placeholder="Ej: Técnico eléctrico"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20"
                    :class="personaModalErrors.cargo ? 'has-error' : ''">
                  <p class="form-error" x-show="personaModalErrors.cargo" x-text="personaModalErrors.cargo"></p>
                </div>
                <div>
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Correo electrónico <span class="text-red-500">*</span></label>
                  <input type="email" x-model="nuevaPersona.correo" placeholder="Ej: persona@ejemplo.com" required
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20"
                    :class="personaModalErrors.correo ? 'has-error' : ''">
                  <p class="form-error" x-show="personaModalErrors.correo" x-text="personaModalErrors.correo"></p>
                </div>
                <div class="sm:col-span-2">
                  <label class="form-label text-xs font-semibold text-[var(--paper-ink)] mb-1 block">Observación (Opcional)</label>
                  <input type="text" x-model="nuevaPersona.observacion" placeholder="Detalle o nota adicional"
                    class="input-field w-full rounded-lg px-3 py-2 text-sm bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20">
                </div>

                <!-- Sección: Documentos adjuntos (Relación 1 a N) -->
                <div class="sm:col-span-2 mt-2 pt-3 border-t border-dashed border-[var(--paper-shadow)]">
                  <div class="flex items-center justify-between mb-2">
                    <div>
                      <label class="form-label mb-0 font-semibold text-xs text-[var(--paper-ink)]">Documentos adjuntos</label>
                      <p class="text-[11px] text-[var(--paper-muted)]">Adjunta los certificados y documentos necesarios (PDF/Imágenes)</p>
                    </div>
                    <button type="button" @click="addDocumentoPersona()"
                      class="btn-adjuntar-otro">
                      <i class="fa-solid fa-plus"></i> Adjuntar otro
                    </button>
                  </div>

                  <div class="space-y-2.5 mt-2">
                    <template x-for="(doc, dIdx) in nuevaPersona.documentos" :key="dIdx">
                      <div
                        class="p-3 rounded-xl border border-[var(--paper-shadow)] bg-[#efe9dc]/50 dark:bg-white/[0.04] flex flex-col gap-2">
                        <!-- Fila principal de campos -->
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                          <!-- Tipo de documento -->
                          <div class="w-full sm:w-1/2">
                            <label x-show="doc.tipo_doc === 'Planilla seguridad social'"
                              class="form-label text-[11px] font-semibold text-[var(--paper-ink)] mb-1 block">
                              Tipo de documento
                            </label>
                            <select x-model="doc.tipo_doc"
                              @change="if (doc.tipo_doc !== 'Planilla seguridad social') doc.vigencia = ''"
                              class="input-field w-full rounded-lg px-2.5 py-1.5 text-xs bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)]">
                              <template x-for="t in tiposDocAdjuntoPersona" :key="t">
                                <option :value="t" x-text="t"></option>
                              </template>
                            </select>
                          </div>

                          <!-- Vigencia de la planilla (posicionada al lado del tipo de documento si es Planilla) -->
                          <div x-show="doc.tipo_doc === 'Planilla seguridad social'"
                            class="w-full sm:w-1/2">
                            <label class="form-label text-[11px] font-semibold text-[var(--paper-ink)] mb-1 flex items-center gap-1.5">
                              <i class="fa-regular fa-calendar-check text-[var(--signal-500)]"></i>
                              <span>Vigencia de la planilla</span>
                            </label>
                            <div class="relative flatpickr-vigencia-wrapper">
                              <i class="fa-regular fa-calendar text-[var(--signal-500)]"></i>
                              <input type="text"
                                placeholder="dd/mm/aaaa"
                                x-model="doc.vigencia"
                                x-init="initFlatpickrDoc($el, doc)"
                                class="input-field w-full rounded-lg text-xs bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20 cursor-pointer"
                                readonly>
                            </div>
                          </div>

                          <!-- Subir Archivo (cuando NO es planilla, comparte la fila 1) -->
                          <div x-show="doc.tipo_doc !== 'Planilla seguridad social'"
                            class="flex-1 relative flex items-center min-w-0">
                            <label
                              class="w-full cursor-pointer flex items-center justify-between border border-dashed border-[var(--paper-shadow)] hover:border-red-500 rounded-lg px-3 py-1.5 text-xs bg-white transition">
                              <span class="truncate text-[var(--paper-ink)]"
                                x-text="doc.nombre_archivo || 'Seleccionar archivo (PDF)...'"></span>
                              <i
                                class="fa-solid fa-cloud-arrow-up text-red-500 ml-2 text-xs flex-shrink-0"></i>
                              <input type="file" accept="application/pdf,.pdf,image/*"
                                @change="handleDocumentoPersonaFile($event, dIdx)" class="hidden">
                            </label>
                          </div>

                          <!-- Botón eliminar fila (cuando NO es planilla) -->
                          <button x-show="doc.tipo_doc !== 'Planilla seguridad social'"
                            type="button" @click="removeDocumentoPersona(dIdx)"
                            class="action-icon-btn danger flex-shrink-0 self-end sm:self-auto" title="Eliminar fila">
                            <i class="fa-solid fa-trash text-xs"></i>
                          </button>
                        </div>

                        <!-- Fila 2 para Planilla de seguridad social: Subir Archivo + Eliminar -->
                        <div x-show="doc.tipo_doc === 'Planilla seguridad social'"
                          x-transition:enter="transition ease-out duration-200"
                          x-transition:enter-start="opacity-0 -translate-y-1"
                          x-transition:enter-end="opacity-100 translate-y-0"
                          class="flex items-center gap-2 pt-0.5">
                          <div class="flex-1 relative flex items-center min-w-0">
                            <label
                              class="w-full cursor-pointer flex items-center justify-between border border-dashed border-[var(--paper-shadow)] hover:border-red-500 rounded-lg px-3 py-1.5 text-xs bg-white transition">
                              <span class="truncate text-[var(--paper-ink)]"
                                x-text="doc.nombre_archivo || 'Seleccionar archivo de planilla (PDF)...'"></span>
                              <i
                                class="fa-solid fa-cloud-arrow-up text-red-500 ml-2 text-xs flex-shrink-0"></i>
                              <input type="file" accept="application/pdf,.pdf,image/*"
                                @change="handleDocumentoPersonaFile($event, dIdx)" class="hidden">
                            </label>
                          </div>
                          <button type="button" @click="removeDocumentoPersona(dIdx)"
                            class="action-icon-btn danger flex-shrink-0" title="Eliminar fila">
                            <i class="fa-solid fa-trash text-xs"></i>
                          </button>
                        </div>

                        <!-- Input condicional para especificar 'Otro documento' -->
                        <div x-show="doc.tipo_doc === 'Otro documento' || doc.tipo_doc === 'Otro'"
                          x-transition:enter="transition ease-out duration-200"
                          x-transition:enter-start="opacity-0 -translate-y-1"
                          x-transition:enter-end="opacity-100 translate-y-0"
                          class="pt-1">
                          <input type="text" x-model="doc.tipo_doc_otro"
                            placeholder="Especifica qué tipo de documento es (ej: Inducción, Certificado OIT...)"
                            class="input-field w-full rounded-lg px-2.5 py-1.5 text-xs bg-white border border-[var(--paper-shadow)] text-[var(--paper-ink)] focus:border-red-500 focus:ring-1 focus:ring-red-500/20">
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t border-dashed border-[var(--paper-shadow)]">
                <button type="button" @click="closePersonaModal()" :disabled="guardandoPersona"
                  class="modal-btn-cancel px-5 py-2.5 text-sm font-semibold">
                  Cancelar
                </button>
                <button type="button" @click="guardarNuevaPersona()" :disabled="guardandoPersona"
                  class="modal-btn-confirm px-6 py-2.5 text-sm font-semibold flex items-center gap-2">
                  <i class="fa-solid fa-circle-notch fa-spin text-xs" x-show="guardandoPersona"></i>
                  <span x-text="guardandoPersona ? 'Guardando...' : (isEditingPersona ? 'Guardar cambios' : 'Guardar persona')"></span>
                </button>
              </div>

              <!-- Borde dentado ticket visible al pie -->
              <div class="modal-serrated"></div>
            </div>
          </div>
