<header
        class="topbar flex items-center justify-between px-3 sm:px-6 sticky top-0 z-30">
        <div class="flex items-center gap-2 sm:gap-4 min-w-0">
          <button type="button" @click="sidebarOpenMobile = true" class="mobile-menu-btn flex-shrink-0" aria-label="Abrir menú de navegación">
            <i class="fa-solid fa-bars text-base"></i>
          </button>
          <h1 class="font-display font-semibold text-base sm:text-lg text-white truncate max-w-[160px] sm:max-w-none">{{ page_title | default("Dashboard") }}</h1>
          <span
            class="role-chip hidden sm:inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-semibold bg-[var(--signal-500)] flex-shrink-0">
            <span x-text="activeRole"></span>
          </span>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-4 flex-shrink-0">
          <!-- Notificaciones -->
          <div class="relative" @click.outside="notificationsOpen = false">
            <button @click="notificationsOpen = !notificationsOpen"
              class="relative w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-white transition-colors hover:bg-white/10"
              title="Notificaciones">
              <i class="fa-regular fa-bell text-sm sm:text-base"></i>
              <span class="badge-count absolute top-0.5 right-0.5 sm:top-1.5 sm:right-1.5 rounded-full flex items-center justify-center px-1 text-[10px] sm:text-[11px] font-bold"
                x-show="unreadNotificationsCount > 0"
                x-text="unreadNotificationsCount" x-cloak></span>
            </button>
            <div x-show="notificationsOpen" x-transition x-cloak
              class="notifications-panel absolute right-0 mt-2 w-[calc(100vw-24px)] max-w-[350px] sm:max-w-[430px] overflow-hidden z-50">
              <div class="notifications-header flex items-center justify-between">
                <div class="font-semibold text-sm flex items-center gap-2.5">
                  <span class="notifications-title font-semibold tracking-tight">Notificaciones</span>
                  <span class="notifications-count-badge text-[11px] rounded-full font-medium"
                        x-text="unreadNotificationsCount + ' no leídas'"></span>
                </div>
                <button type="button" @click="marcarTodasNotificacionesLeidas()"
                        x-show="unreadNotificationsCount > 0"
                        class="btn-mark-all">
                  Marcar todas
                </button>
              </div>

              <div class="max-h-[55vh] sm:max-h-96 overflow-y-auto custom-scroll">
                <template x-for="n in (notifications || []).slice(0, 3)" :key="n.id">
                  <div @click="marcarNotificacionLeida(n)"
                       class="notification-item flex items-start gap-3.5"
                       :class="{
                         'is-unread': !n.leido,
                         'notif-item-success': n.tipo === 'success',
                         'notif-item-error': n.tipo === 'error' || n.tipo === 'danger',
                         'notif-item-warning': n.tipo === 'warning',
                         'notif-item-info': !n.tipo || n.tipo === 'info'
                       }">
                    <div class="mt-0.5 w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-sm shadow-sm"
                         :class="{
                           'notif-icon-success': n.tipo === 'success',
                           'notif-icon-error': n.tipo === 'error' || n.tipo === 'danger',
                           'notif-icon-warning': n.tipo === 'warning',
                           'notif-icon-info': !n.tipo || n.tipo === 'info'
                         }">
                      <i class="fa-solid" :class="{
                        'fa-circle-check': n.tipo === 'success',
                        'fa-triangle-exclamation': n.tipo === 'error' || n.tipo === 'danger',
                        'fa-bell': n.tipo === 'warning',
                        'fa-info': !n.tipo || n.tipo === 'info'
                      }"></i>
                    </div>
                    <div class="flex-1 min-w-0 pr-1">
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <p class="text-[13px] truncate font-semibold"
                           :class="!n.leido ? 'notification-title-unread' : 'notification-title-read'"
                           x-text="n.titulo"></p>
                        <span class="notification-time text-[10px] flex-shrink-0 font-medium cursor-help" :title="formatearFechaHora(n.fecha_creacion)" x-text="formatearTiempoRelativo(n.fecha_creacion)"></span>
                      </div>
                      <p class="notification-msg text-xs leading-relaxed" x-text="n.mensaje"></p>

                      <!-- Enlace adjunto -->
                      <div x-show="n.enlace" class="mt-2 max-w-full">
                        <a :href="n.enlace" target="_blank" rel="noopener noreferrer" @click.stop="marcarNotificacionLeida(n)"
                          class="inline-flex items-center gap-1.5 max-w-full px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 border border-blue-500/20 transition-all shadow-2xs group"
                          :title="n.enlace">
                          <i class="fa-solid fa-arrow-up-right-from-square text-[9px] flex-shrink-0 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                          <span class="truncate min-w-0" x-text="formatearTextoEnlace(n.enlace) || 'Abrir enlace'"></span>
                        </a>
                      </div>

                      <!-- Documento adjunto descargable -->
                      <div x-show="n.archivo_url" class="mt-2 max-w-full">
                        <a :href="n.archivo_url" :download="n.archivo_nombre || true" target="_blank" rel="noopener noreferrer" @click.stop="marcarNotificacionLeida(n)"
                          class="inline-flex items-center gap-1.5 max-w-full px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-400 border border-emerald-500/25 transition-all shadow-2xs group"
                          :title="'Descargar ' + (n.archivo_nombre || 'documento')">
                          <i class="fa-solid fa-file-arrow-down text-[10px] text-emerald-600 dark:text-emerald-400 flex-shrink-0 group-hover:translate-y-0.5 transition-transform"></i>
                          <span class="truncate min-w-0" x-text="n.archivo_nombre || 'Descargar documento adjunto'"></span>
                        </a>
                      </div>

                      <!-- Acciones en notificación de pre-aprobada -->
                      <template x-if="esNotifPreaprobada(n)">
                        <div class="mt-2.5">
                          <div x-show="n.aprobadoExitoso" class="py-1 px-2.5 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 font-bold text-[11px] flex items-center gap-1.5">
                            <i class="fa-solid fa-circle-check text-xs"></i>
                            <span>Aprobación confirmada</span>
                          </div>
                          <div x-show="!n.aprobadoExitoso" class="flex items-center gap-2">
                            <button type="button" @click.stop="revisarSolicitudNotif(n)"
                              class="flex-1 py-1.5 px-2 rounded-lg text-xs font-semibold bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 transition-colors flex items-center justify-center gap-1 shadow-xs cursor-pointer">
                              <i class="fa-solid fa-eye text-[11px]"></i>
                              <span>Revisar</span>
                            </button>
                            <button type="button" @click.stop="confirmarAprobacionDirectaNotif(n)" :disabled="n.aprobando"
                              class="flex-1 py-1.5 px-2 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white transition-colors flex items-center justify-center gap-1 shadow-xs cursor-pointer"
                              :class="n.aprobando ? 'opacity-60 cursor-not-allowed' : ''">
                              <i class="fa-solid" :class="n.aprobando ? 'fa-circle-notch fa-spin text-[11px]' : 'fa-check-double text-[11px]'"></i>
                              <span x-text="n.aprobando ? 'Aprobando...' : 'Confirmar'"></span>
                            </button>
                          </div>
                        </div>
                      </template>
                    </div>
                    <span x-show="!n.leido" class="unread-dot flex-shrink-0 self-center ml-1"></span>
                  </div>
                </template>

                <div x-show="notifications.length === 0" class="notification-empty py-10 text-center text-xs">
                  <i class="fa-regular fa-bell-slash text-3xl mb-2.5 opacity-40 block"></i>
                  No tienes notificaciones pendientes
                </div>
              </div>

              <!-- Pie del Dropdown: Ver todas las notificaciones -->
              <div class="p-2.5 bg-slate-50 dark:bg-black/30 border-t border-[var(--border-subtle)] flex items-center justify-between gap-2">
                <span class="text-[11px] text-[var(--paper-muted)] font-medium pl-1.5"
                      x-text="notifications.length > 3 ? ('Mostrando 3 de ' + notifications.length) : (notifications.length + ' en total')">
                </span>
                <button type="button" 
                        @click="notificationsOpen = false; abrirModalTodasNotificaciones()"
                        class="btn-notif-ver-todas inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold text-[var(--signal-500)] hover:bg-[var(--signal-500)]/10 transition-colors cursor-pointer">
                  <span>Ver todas</span>
                  <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Modo oscuro -->
          <button
            @click="toggleDarkMode()"
            class="relative w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-white transition-colors hover:bg-white/10"
            :title="darkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            <i class="fa-solid text-sm sm:text-base transition-all duration-300"
               :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon'"></i>
          </button>

          <!-- Perfil -->
          <div class="relative" x-data="{ open: false }" @click.outside="open = false">
            <button @click="open = !open"
                    class="navbar-user-btn flex items-center gap-2 pl-1.5 pr-2.5 py-1 rounded-full group cursor-pointer transition-all duration-200"
                    :class="open ? 'navbar-user-btn-open' : ''">
              <div class="relative flex-shrink-0">
                <div
                  class="w-7 h-7 sm:w-8 sm:h-8 rounded-full inicialesUser flex items-center justify-center text-[11px] sm:text-xs font-bold flex-shrink-0 transition-transform duration-200 group-hover:scale-105"
                  x-text="userInitials"><b>LG</b></div>
                <span class="navbar-user-status-dot"></span>
              </div>
              <span class="hidden md:block text-xs sm:text-sm font-semibold text-white tracking-tight truncate max-w-[130px]" x-text="userDisplayName"></span>
              <i class="fa-solid fa-chevron-down text-[9px] text-white/70 transition-transform duration-200 group-hover:text-white"
                 :class="open ? 'rotate-180 text-orange-400' : ''"></i>
            </button>
            <div x-show="open" x-transition x-cloak
              class="navbar-user-dropdown absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-[var(--shadow-panel)] border border-[var(--border-subtle)] overflow-hidden z-50">
              <button @click="$dispatch('open-profile'); open = false"
                class="dropdown-item-profile w-full text-left px-4 py-2.5 text-sm hover:bg-[var(--steel-100)] flex items-center gap-2">
                <i class="fa-regular fa-user w-4"></i> <span>Ver perfil</span>
              </button>
              <div class="dropdown-divider"></div>
              <button type="button"
                @click="(typeof cerrarSesion === 'function') ? cerrarSesion() : cerrarSesionUsuario()"
                class="dropdown-item-logout w-full text-left px-4 py-2.5 text-sm hover:bg-[var(--steel-100)] flex items-center gap-2 text-[var(--state-rechazado)]">
                <i class="fa-solid fa-arrow-right-from-bracket w-4"></i> <span>Cerrar sesión</span>
              </button>
            </div>
          </div>
        </div>
      </header>
