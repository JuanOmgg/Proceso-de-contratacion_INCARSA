<header
        class="topbar flex items-center justify-between px-6 sticky top-0 z-30">
        <div class="flex items-center gap-3 sm:gap-4">
          <button type="button" @click="sidebarOpenMobile = true" class="mobile-menu-btn" aria-label="Abrir menú de navegación">
            <i class="fa-solid fa-bars text-base"></i>
          </button>
          <h1 class="font-display font-semibold text-lg text-white">{{ page_title | default("Dashboard") }}</h1>
          <span
            class="role-chip hidden sm:inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-semibold bg-[var(--signal-500)]">
            <span x-text="activeRole"></span>
          </span>
        </div>

        <div class="flex items-center gap-4">
          <!-- Notificaciones -->
          <div class="relative" @click.outside="notificationsOpen = false">
            <button @click="notificationsOpen = !notificationsOpen"
              class="relative w-10 h-10 rounded-full flex items-center justify-center text-white">
              <i class="fa-regular fa-bell text-base"></i>
              <span class="badge-count absolute top-1.5 right-1.5 rounded-full flex items-center justify-center px-1"
                x-text="notifications.length"></span>
            </button>
            <div x-show="notificationsOpen" x-transition x-cloak
              class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-[var(--shadow-panel)] border border-[var(--border-subtle)] overflow-hidden">
              <div class="px-4 py-3 border-b border-[var(--border-subtle)] font-semibold text-sm">Notificaciones</div>
              <template x-for="n in notifications" :key="n.id">
                <div
                  class="px-4 py-3 border-b border-[var(--border-subtle)] last:border-0 hover:bg-[var(--steel-100)] text-sm">
                  <p class="text-[var(--text-primary)]" x-text="n.texto"></p>
                  <p class="text-xs text-[var(--text-muted)] mt-0.5" x-text="n.tiempo"></p>
                </div>
              </template>
            </div>
          </div>

          <!-- Modo oscuro -->
          <button
            @click="toggleDarkMode()"
            class="relative w-10 h-10 rounded-full flex items-center justify-center text-white transition-colors hover:bg-white/10"
            :title="darkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            <i class="fa-solid text-base transition-all duration-300"
               :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon'"></i>
          </button>

          <!-- Perfil -->
          <div class="relative" x-data="{ open: false }" @click.outside="open = false">
            <button @click="open = !open" class="flex items-center gap-2 pl-2 pr-1 py-1 rounded-full">
              <div
                class="w-8 h-8 rounded-full inicialesUser bg-[var(--steel-200)] text-[var(--ink-900)] flex items-center justify-center text-xs font-semibold"
                x-text="userInitials"><b>LG</b></div>
              <span class="hidden md:block text-sm font-medium text-white" x-text="userDisplayName">Laura Gómez</span>
              <i class="fa-solid fa-chevron-down text-[10px] text-[var(--text-muted)]"></i>
            </button>
            <div x-show="open" x-transition x-cloak
              class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-[var(--shadow-panel)] border border-[var(--border-subtle)] overflow-hidden z-50">
              <button @click="$dispatch('open-profile'); open = false"
                class="w-full text-left px-4 py-2.5 text-sm hover:bg-[var(--steel-100)] flex items-center gap-2">
                <i class="fa-regular fa-user w-4"></i> Ver perfil
              </button>
              <a href="/login"
                class="w-full text-left px-4 py-2.5 text-sm hover:bg-[var(--steel-100)] flex items-center gap-2 text-[var(--state-rechazado)]">
                <i class="fa-solid fa-arrow-right-from-bracket w-4"></i> Cerrar sesión
              </a>
            </div>
          </div>
        </div>
      </header>
