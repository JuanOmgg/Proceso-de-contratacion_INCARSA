<!-- ============================================================
     OVERLAY AUTÓNOMO DE TRANSICIÓN ENTRE PÁGINAS · PSI
     ============================================================ -->
<div id="pageTransitionOverlay" class="page-loader-overlay is-active" aria-hidden="false" style="display: flex;">
  <div class="page-loader-content">
    
    <!-- Spinner orbital grande -->
    <div class="page-loader-pulse">
      <div class="page-loader-spinner"></div>
    </div>

    <!-- Texto de carga -->
    <div class="page-loader-text">
      <span>Cargando</span><span class="pdot">.</span><span class="pdot">.</span><span class="pdot">.</span>
    </div>

  </div>
</div>

<style>
  /* Contenedor a pantalla completa 100% aislado y autónomo */
  .page-loader-overlay {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    z-index: 9999999 !important;
    display: flex;
    opacity: 1;
    pointer-events: all;
    background-color: #0c0c0e !important;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(240, 50, 62, 0.12) 0%, transparent 60%),
      radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px) !important;
    background-size: auto, 20px 20px !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center !important;
    transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease !important;
    transform: scale(1);
    filter: blur(0px);
  }

  /* Estado visible al estar activo */
  .page-loader-overlay.is-active {
    opacity: 1 !important;
    pointer-events: all !important;
    transform: scale(1) !important;
    filter: blur(0px) !important;
  }

  /* Estado al desvanecerse (salida suave) */
  .page-loader-overlay:not(.is-active) {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: scale(1.03) !important;
    filter: blur(6px) !important;
  }

  .page-loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
  }

  .page-loader-overlay:not(.is-active) .page-loader-content {
    transform: translateY(-8px) scale(0.97);
    opacity: 0;
  }

  /* Animación de pulso */
  .page-loader-pulse {
    animation: ploaderPulse 3s ease-in-out infinite;
    margin-bottom: 22px;
  }

  @keyframes ploaderPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.04); opacity: 0.9; }
  }

  /* Spinner Orbital Grande Autónomo */
  .page-loader-spinner {
    --size: 1.3px;
    --color-1: #ffffff;
    --color-2: var(--role-primary, #F0323E);
    position: relative;
    transform: rotateZ(45deg);
    perspective: calc(1000 * var(--size));
    border-radius: 50%;
    width: calc(48 * var(--size));
    height: calc(48 * var(--size));
    color: var(--color-1);
    margin: 0 auto;
  }

  .page-loader-spinner:before,
  .page-loader-spinner:after {
    content: '';
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: inherit;
    height: inherit;
    border-radius: 50%;
    transform: rotateX(70deg);
    animation: 1s ploaderSpin linear infinite;
  }

  .page-loader-spinner:after {
    color: var(--color-2);
    transform: rotateY(70deg);
    animation-delay: 0.4s;
  }

  @keyframes ploaderSpin {
    0%, 100% { box-shadow: 0.2em 0 0 0 currentcolor; }
    12% { box-shadow: 0.2em 0.2em 0 0 currentcolor; }
    25% { box-shadow: 0 0.2em 0 0 currentcolor; }
    37% { box-shadow: -0.2em 0.2em 0 0 currentcolor; }
    50% { box-shadow: -0.2em 0 0 0 currentcolor; }
    62% { box-shadow: -0.2em -0.2em 0 0 currentcolor; }
    75% { box-shadow: 0 -0.2em 0 0 currentcolor; }
    87% { box-shadow: 0.2em -0.2em 0 0 currentcolor; }
  }

  /* Texto de Estado "Cargando..." */
  .page-loader-text {
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    letter-spacing: 0.16em !important;
    text-transform: uppercase !important;
    color: #f8fafc !important;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.45), 0 0 24px var(--role-glow, rgba(240, 50, 62, 0.35)) !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 3px !important;
  }

  .page-loader-text .pdot {
    display: inline-block;
    color: var(--role-primary, #F0323E);
    font-weight: 700;
    animation: ploaderDot 1.4s infinite;
  }
  .page-loader-text .pdot:nth-child(2) { animation-delay: 0.2s; }
  .page-loader-text .pdot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes ploaderDot {
    0%, 20% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
    80%, 100% { opacity: 0; transform: translateY(0); }
  }

  /* Soporte Modo Claro en Page Loader */
  html:not(.dark) .page-loader-overlay {
    background-color: rgba(248, 250, 252, 0.96) !important;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(240, 50, 62, 0.08) 0%, transparent 60%),
      radial-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px) !important;
    background-size: auto, 20px 20px !important;
  }
  html:not(.dark) .page-loader-spinner {
    --color-1: #0f172a;
    --color-2: var(--role-primary, #F0323E);
  }
  html:not(.dark) .page-loader-text {
    color: #0f172a !important;
    text-shadow: none !important;
  }
  .page-loader-text .pdot:nth-child(2) { animation-delay: 0.2s; }
  .page-loader-text .pdot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes ploaderDot {
    0%, 20% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
    80%, 100% { opacity: 0; transform: translateY(0); }
  }
</style>

<script>
  (function () {
    const overlay = document.getElementById("pageTransitionOverlay");
    if (!overlay) return;

    let hideTimer = null;

    function showLoader() {
      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
      overlay.style.display = "flex";
      void overlay.offsetHeight; // Forzar reflow para animación suave de opacidad
      overlay.classList.add("is-active");
    }

    function hideLoader() {
      overlay.classList.remove("is-active");
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        if (!overlay.classList.contains("is-active")) {
          overlay.style.display = "none";
        }
      }, 460);
    }

    // Funciones globales para invocar manualmente desde JS
    window.showPageLoader = showLoader;
    window.hidePageLoader = hideLoader;

    // Asegurar que el loader esté visible al iniciar la carga del módulo/ventana
    showLoader();

    function scheduleHide() {
      setTimeout(function () {
        hideLoader();
      }, 200);
    }

    // Interceptar clics en enlaces de navegación entre módulos (sidebar, navbar, enlaces internos)
    document.addEventListener("click", function (e) {
      if (e.defaultPrevented || e.button !== 0) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      const a = e.target.closest("a[href]");
      if (!a) return;

      const rawHref = a.getAttribute("href");
      if (!rawHref) return;

      // Ignorar anclas internas, javascript, correo o teléfono
      if (rawHref === "#" || rawHref.startsWith("#") || rawHref.startsWith("javascript:") || rawHref.startsWith("mailto:") || rawHref.startsWith("tel:")) {
        return;
      }

      // Ignorar descargas de documentos o blobs
      if (a.hasAttribute("download") || rawHref.startsWith("/uploads/") || rawHref.startsWith("blob:") || rawHref.startsWith("data:")) {
        return;
      }

      // Ignorar elementos marcados explícitamente para no activar loader
      if (a.hasAttribute("data-no-loader") || a.closest("[data-no-loader]")) {
        return;
      }

      try {
        const dest = new URL(a.href, window.location.href);
        if (dest.origin !== window.location.origin) return;

        // Si se abre en una ventana/pestaña nueva (target="_blank")
        if (a.target && a.target !== "_self" && a.target !== "") {
          showLoader();
          setTimeout(function () {
            hideLoader();
          }, 800);
          return;
        }

        const currentPath = window.location.pathname + window.location.search;
        const destPath = dest.pathname + dest.search;
        if (currentPath === destPath) {
          return;
        }

        try {
          sessionStorage.setItem("incarsa_page_transition", "1");
        } catch (err) {}

        e.preventDefault();
        showLoader();

        setTimeout(function () {
          window.location.href = a.href;
        }, 120);
      } catch (err) {}
    });

    // Controladores para ocultar de forma fluida el preloader cuando la página esté lista
    window.addEventListener("pageshow", function () {
      scheduleHide();
    });

    document.addEventListener("DOMContentLoaded", function () {
      scheduleHide();
    });

    window.addEventListener("load", function () {
      scheduleHide();
    });

    document.addEventListener("alpine:initialized", function () {
      scheduleHide();
    });

    // Timeout de seguridad máximo (2s) para evitar bloqueos
    setTimeout(function () {
      hideLoader();
    }, 2000);
  })();
</script>
