<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}INCARSA{% endblock %}</title>

  <!-- Favicon / Ícono de la pestaña del navegador -->
  <link rel="icon" type="image/png" href="{{ url_for('static', path='img/icono.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', path='img/icono.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='img/icono.png') }}">

  <!-- Inicialización inmediata de Modo Oscuro para evitar parpadeos y sincronizar entre pantallas -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('darkMode') === 'true') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Núcleo de Configuración y Guardián de Rutas RBAC Temprano (previene acceso indebido y FOUC) -->
  <script src="{{ url_for('static', path='js/config.js') }}?v=3.5"></script>
  <script src="{{ url_for('static', path='js/permisos.js') }}?v=3.6"></script>

  <!-- Ocultar de inmediato modales y elementos condicionales antes de que Alpine inicialice (FOUC) -->
  <style>
    [x-cloak], [x-cloak] * {
      display: none !important;
    }
  </style>

  <!-- Tailwind CSS Compilado Local -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Fonts: Space Grotesk (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Estilos globales compartidos -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=3.9">
  <link rel="stylesheet" href="{{ url_for('static', path='css/navbar-sidebar.css') }}?v=3.7">
  <link rel="stylesheet" href="{{ url_for('static', path='css/dark-mode.css') }}?v=3.8">

  <!-- Bloque para estilos o librerías adicionales de cada plantilla -->
  {% block extra_head %}{% endblock %}

  <!-- Módulos utilitarios compartidos -->
  <script src="{{ url_for('static', path='js/alertas.js') }}?v=3.5"></script>
  <script src="{{ url_for('static', path='js/tooltips.js') }}?v=3.5"></script>
  <script src="{{ url_for('static', path='js/mantenimiento.js') }}?v=3.5"></script>
  <script src="{{ url_for('static', path='js/app-shell.js') }}?v=3.6"></script>
  <script src="{{ url_for('static', path='js/notificaciones.js') }}?v=3.6"></script>
  <script src="{{ url_for('static', path='js/plantas.js') }}?v=3.5"></script>
  <script src="{{ url_for('static', path='js/contratistas.js') }}?v=3.5"></script>
  <script src="{{ url_for('static', path='js/vehiculos.js') }}?v=3.5"></script>

  <!-- Scripts que deben ejecutarse antes de inicializar Alpine -->
  {% block extra_js %}{% endblock %}

  <!-- Alpine.js Collapse + Core -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body class="antialiased">

  <!-- Pantalla de carga y transición autónoma entre páginas -->
  {% include 'pages/page-loader.html' %}

  <!-- Contenido principal inyectado por cada plantilla -->
  {% block content %}{% endblock %}

  <!-- Modal Global de Perfil de Usuario -->
  {% include 'components/modal-perfil.html' %}

  <!-- Bloque opcional para scripts al final del body -->
  {% block body_scripts %}{% endblock %}

</body>
</html>
