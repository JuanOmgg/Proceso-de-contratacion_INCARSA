<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}INCARSA{% endblock %}</title>

  <!-- Favicon / Ícono de la pestaña del navegador -->
  <link rel="icon" type="image/png" href="{{ url_for('static', path='img/icono.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', path='img/icono.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='img/icono.png') }}">

  <!-- Inicialización inmediata de Modo Oscuro para evitar parpadeos y sincronizar entre pantallas -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('darkMode') === 'true') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Guardián de Navegación y Permisos de Rol (Auth Guard + RBAC) -->
  <script>
    (function () {
      try {
        var token = sessionStorage.getItem('incarsa_token') || localStorage.getItem('incarsa_token');
        if (!token) {
          window.location.replace('/login');
          return;
        }

        var path = window.location.pathname.toLowerCase();
        // Rutas universales / libres de validación
        if (path === '/' || path === '/dashboard' || path.includes('/login') || path.includes('/403') || path.includes('/404') || path.includes('/500') || path.includes('/503') || path.includes('/splash-loading') || path.includes('/cargando')) {
          return;
        }

        var sesionStr = sessionStorage.getItem('incarsa_session') || localStorage.getItem('incarsa_session');
        if (!sesionStr) return;
        var sesion = JSON.parse(sesionStr);
        var rol = (sesion && sesion.rol ? String(sesion.rol) : '').trim().toUpperCase();

        // SUPERADMIN siempre tiene acceso total
        if (rol === 'SUPERADMIN') return;

        // Permisos dinámicos si están cargados
        var permisos = null;
        try {
          permisos = JSON.parse(sessionStorage.getItem('incarsa_permisos') || localStorage.getItem('incarsa_permisos') || 'null');
        } catch (e) {}

        function tieneAcceso(modulo, rolesPermitidos) {
          if (permisos && permisos[modulo] && permisos[modulo].ver !== undefined) {
            return !!permisos[modulo].ver;
          }
          return rolesPermitidos.indexOf(rol) !== -1;
        }

        var denegado = false;

        // 1. Módulo Usuarios y Formulario de Usuarios (Solo Administrador)
        if (path === '/usuarios' || path.startsWith('/usuarios/') || path.includes('formulario-usuarios') || path.includes('usuario-formulario')) {
          if (!tieneAcceso('usuarios', ['ADMINISTRADOR'])) {
            denegado = true;
          }
        }
        // 2. Módulo Nueva Solicitud
        else if (path === '/solicitudes/nueva' || path.includes('formulario-solicitudes') || path.includes('solicitudes-formulario')) {
          if (!tieneAcceso('nueva_solicitud', ['ADMINISTRADOR', 'GESTION DOCUMENTAL', 'SST', 'GESCO', 'SCR'])) {
            denegado = true;
          }
        }
        // 3. Módulo Procesamiento
        else if (path === '/procesamiento' || path.startsWith('/procesamiento/')) {
          if (!tieneAcceso('procesamiento', ['ADMINISTRADOR', 'SST', 'GESCO', 'SCR'])) {
            denegado = true;
          }
        }
        // 4. Módulo Antecedentes
        else if (path === '/antecedentes' || path.startsWith('/antecedentes/')) {
          if (!tieneAcceso('antecedentes', ['ADMINISTRADOR', 'SCR'])) {
            denegado = true;
          }
        }
        // 5. Panel de Superadmin
        else if (path === '/superadmin' || path.startsWith('/superadmin/')) {
          if (rol !== 'SUPERADMIN') {
            denegado = true;
          }
        }

        if (denegado) {
          console.warn('⛔ [RBAC] Acceso denegado a la ruta ' + path + ' para el rol: ' + rol);
          window.location.replace('/403');
        }
      } catch (e) {
        console.warn('Error en guardián de permisos:', e);
      }
    })();
  </script>

  <!-- Ocultar de inmediato modales y elementos condicionales antes de que Alpine inicialice (FOUC) -->
  <style>
    [x-cloak], [x-cloak] * {
      display: none !important;
    }
  </style>

  <!-- Tailwind CSS Compilado Local -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Fonts: Space Grotesk (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Estilos globales compartidos -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=3.5">
  <link rel="stylesheet" href="{{ url_for('static', path='css/navbar-sidebar.css') }}?v=3.5">
  <link rel="stylesheet" href="{{ url_for('static', path='css/dark-mode.css') }}?v=3.5">

  <!-- Bloque para estilos o librerías adicionales de cada plantilla -->
  {% block extra_head %}{% endblock %}

  <!-- Configuración compartida -->
  <script src="{{ url_for('static', path='js/config.js') }}?v=2.5"></script>
  <script src="{{ url_for('static', path='js/plantas.js') }}"></script>
  <script src="{{ url_for('static', path='js/contratistas.js') }}"></script>
  <script src="{{ url_for('static', path='js/vehiculos.js') }}"></script>

  <!-- Scripts que deben ejecutarse antes de inicializar Alpine -->
  {% block extra_js %}{% endblock %}

  <!-- Alpine.js Collapse + Core -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body class="antialiased">

  <!-- Pantalla de carga y transición autónoma entre páginas -->
  {% include 'pages/page-loader.html' %}

  <!-- Contenido principal inyectado por cada plantilla -->
  {% block content %}{% endblock %}

  <!-- Bloque opcional para scripts al final del body -->
  {% block body_scripts %}{% endblock %}

</body>
</html>
